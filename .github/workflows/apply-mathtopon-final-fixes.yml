name: Apply MathTopon final fixes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mathtopon-final-fixes.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified fixes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/mathtopon-final.patch
          git apply --index /tmp/mathtopon-final.patch
          python3 backend/export_static_content.py
          git add frontend/src/data/content.json
          git rm .github/workflows/apply-mathtopon-final-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete final MathTopon quality fixes"
          git push origin main
