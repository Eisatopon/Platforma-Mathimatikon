<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="t d"><title id="t">Κανόνες πράξεων με δεκαδικούς</title><desc id="d">Παράδειγμα πρόσθεσης με ευθυγραμμισμένες υποδιαστολές και πολλαπλασιασμού με έλεγχο δεκαδικών ψηφίων.</desc><rect width="900" height="370" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Οι θέσεις των ψηφίων καθορίζουν το αποτέλεσμα</text><g font-family="Arial"><rect x="75" y="82" width="335" height="225" rx="18" fill="#e2f0fa" stroke="#2878a8" stroke-width="3"/><text x="242" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#173f63">Πρόσθεση</text><g text-anchor="end" font-size="31" fill="#243b4a"><text x="300" y="170">2,40</text><text x="300" y="214">+ 1,75</text><path d="M155 229h155" stroke="#29475c" stroke-width="3"/><text x="300" y="273" font-weight="700">4,15</text></g><path d="M247 135v155" stroke="#b44755" stroke-width="2" stroke-dasharray="6 5"/><rect x="490" y="82" width="335" height="225" rx="18" fill="#e4f4ef" stroke="#2b8f87" stroke-width="3"/><text x="657" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#176253">Πολλαπλασιασμός</text><text x="657" y="177" text-anchor="middle" font-size="29" fill="#243b4a">0,6 · 0,2</text><text x="657" y="222" text-anchor="middle" font-size="21" fill="#536d7d">1 + 1 = 2 δεκαδικά ψηφία</text><text x="657" y="273" text-anchor="middle" font-size="32" font-weight="700" fill="#176253">= 0,12</text></g></svg>
