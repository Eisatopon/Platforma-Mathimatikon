<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="t d"><title id="t">Πίνακας αξίας θέσης δεκαδικού αριθμού</title><desc id="d">Ο αριθμός 12,064 αναλύεται σε δεκάδες, μονάδες, δέκατα, εκατοστά και χιλιοστά.</desc><rect width="900" height="350" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Αξία θέσης στον αριθμό 12,064</text><g font-family="Arial" text-anchor="middle"><g font-size="17" fill="#fff" font-weight="700"><rect x="75" y="85" width="150" height="55" fill="#1f4e7b"/><rect x="225" y="85" width="150" height="55" fill="#2878a8"/><rect x="375" y="85" width="150" height="55" fill="#2b8f87"/><rect x="525" y="85" width="150" height="55" fill="#d17a22"/><rect x="675" y="85" width="150" height="55" fill="#b44755"/><text x="150" y="119">Δεκάδες</text><text x="300" y="119">Μονάδες</text><text x="450" y="119">Δέκατα</text><text x="600" y="119">Εκατοστά</text><text x="750" y="119">Χιλιοστά</text></g><g font-size="48" font-weight="700" fill="#243b4a"><rect x="75" y="140" width="750" height="88" fill="#fff" stroke="#adc4d6" stroke-width="2"/><path d="M225 140v88M375 140v88M525 140v88M675 140v88" stroke="#adc4d6" stroke-width="2"/><text x="150" y="199">1</text><text x="300" y="199">2</text><text x="450" y="199">0</text><text x="600" y="199">6</text><text x="750" y="199">4</text></g><text x="375" y="205" font-size="54" font-weight="700" fill="#b44755">,</text><text x="450" y="290" font-size="24" font-weight="700" fill="#173f63">12,064 = 10 + 2 + 0,06 + 0,004</text></g></svg>
