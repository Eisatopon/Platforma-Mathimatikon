<svg xmlns="http://www.w3.org/2000/svg" width="850" height="430" viewBox="0 0 850 430" role="img" aria-labelledby="t d"><title id="t">Γεωμετρικό μοντέλο του τετραγώνου αθροίσματος</title><desc id="d">Τετράγωνο πλευράς α συν β χωρισμένο σε ένα τετράγωνο α τετράγωνο, δύο ορθογώνια α επί β και ένα τετράγωνο β τετράγωνο.</desc><rect width="850" height="430" fill="#f8fafc"/><g transform="translate(225 30)" stroke="#1e3a8a" stroke-width="3"><rect width="360" height="360" fill="#dbeafe"/><path d="M250 0V360M0 250H360"/><rect width="250" height="250" fill="#93c5fd"/><rect x="250" width="110" height="250" fill="#86efac"/><rect y="250" width="250" height="110" fill="#86efac"/><rect x="250" y="250" width="110" height="110" fill="#fde68a"/></g><g font-family="Arial,sans-serif" font-size="25" fill="#0f172a" text-anchor="middle"><text x="350" y="170">a²</text><text x="530" y="170">ab</text><text x="350" y="345">ab</text><text x="530" y="345">b²</text><text x="405" y="420">(a+b)² = a²+2ab+b²</text></g></svg>
