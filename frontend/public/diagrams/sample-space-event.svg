<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="500" height="300" fill="#ffffff"/>
  <rect x="30" y="30" width="440" height="220" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="50" font-size="15" fill="#64748b">Ω = {1, 2, 3, 4, 5, 6} (δειγματικός χώρος - ρίψη ζαριού)</text>

  <ellipse cx="335" cy="150" rx="130" ry="75" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2.5"/>
  <text x="220" y="90" font-size="14" fill="#10b981" font-weight="700">A = "άρτιος αριθμός"</text>

  <!-- 6 numbered circles for outcomes, 3 inside event A ellipse (2,4,6), 3 outside (1,3,5) -->
  <circle cx="90" cy="100" r="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="90" y="106" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">1</text>

  <circle cx="280" cy="110" r="22" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="280" y="116" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">2</text>

  <circle cx="90" cy="170" r="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="90" y="176" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">3</text>

  <circle cx="335" cy="150" r="22" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="335" y="156" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">4</text>

  <circle cx="150" cy="210" r="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="150" y="216" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">5</text>

  <circle cx="390" cy="190" r="22" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="390" y="196" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">6</text>

  <text x="250" y="280" font-size="14" fill="#475569" text-anchor="middle">Κάθε αποτέλεσμα του Ω ανήκει στο ενδεχόμενο Α ή όχι</text>
</svg>