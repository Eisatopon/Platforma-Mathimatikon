<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="t d"><title id="t">Κανόνες προσήμων σε γινόμενο και πηλίκο</title><desc id="d">Πίνακας δείχνει ότι ίδια πρόσημα δίνουν συν και διαφορετικά πρόσημα δίνουν πλην.</desc><rect width="900" height="350" rx="24" fill="#f5f8fb"/><text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Κανόνες προσήμων</text><g font-family="Arial" text-anchor="middle" font-size="30" font-weight="700"><rect x="150" y="90" width="600" height="190" fill="#fff" stroke="#adc4d6" stroke-width="3"/><path d="M450 90v190M150 185h600" stroke="#adc4d6" stroke-width="3"/><text x="300" y="150" fill="#176253">(+) · (+) = (+)</text><text x="600" y="150" fill="#176253">(−) · (−) = (+)</text><text x="300" y="245" fill="#b44755">(+) · (−) = (−)</text><text x="600" y="245" fill="#b44755">(−) · (+) = (−)</text><text x="450" y="325" font-size="20" fill="#29475c">Οι ίδιοι κανόνες ισχύουν και στη διαίρεση.</text></g></svg>
