<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Πίνακας ανάλογων ποσών</title><desc id="d">Οι τιμές x ένα, δύο, τέσσερα αντιστοιχούν στις τιμές y τρία, έξι, δώδεκα με σταθερό λόγο τρία.</desc><rect width="900" height="360" rx="24" fill="#f5f8fb"/><text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Σταθερός λόγος y : x = 3</text><g font-family="Arial" text-anchor="middle" font-size="28"><g fill="#fff" stroke="#adc4d6" stroke-width="3"><rect x="170" y="95" width="560" height="160"/><path d="M170 175h560M310 95v160M450 95v160M590 95v160"/></g><g font-weight="700"><text x="240" y="145" fill="#173f63">x</text><text x="380" y="145">1</text><text x="520" y="145">2</text><text x="660" y="145">4</text><text x="240" y="225" fill="#176253">y</text><text x="380" y="225">3</text><text x="520" y="225">6</text><text x="660" y="225">12</text></g><text x="450" y="315" font-size="24" font-weight="700" fill="#9b4f11">y = 3x</text></g></svg>
