<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="t d"><title id="t">Μετατροπή μεγάλου αριθμού σε τυποποιημένη μορφή</title><desc id="d">Ο αριθμός 150 εκατομμύρια μετατρέπεται σε 1,5 επί 10 στην ογδόη με μετακίνηση οκτώ θέσεων.</desc><rect width="900" height="350" rx="24" fill="#f5f8fb"/><text x="450" y="53" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Τυποποιημένη μορφή μεγάλου αριθμού</text><g font-family="Arial" text-anchor="middle"><text x="250" y="160" font-size="38" font-weight="700" fill="#243b4a">150.000.000</text><path d="M420 145h110" stroke="#d17a22" stroke-width="6"/><path d="M520 132l24 13-24 13" fill="#d17a22"/><text x="680" y="160" font-size="42" font-weight="700" fill="#176253">1,5 · 10⁸</text><text x="450" y="235" font-size="22" fill="#29475c">Η υποδιαστολή μετακινήθηκε 8 θέσεις προς τα αριστερά</text><text x="450" y="290" font-size="22" font-weight="700" fill="#173f63">1 ≤ 1,5 &lt; 10</text></g></svg>
