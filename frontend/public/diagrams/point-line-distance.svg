<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="360" fill="#ffffff"/>
  <g transform="translate(80,60)">
    <line x1="0" y1="220" x2="480" y2="220" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="220" cy="40" r="5" fill="#dc2626"/>
    <text x="235" y="35" font-size="18" font-weight="700" fill="#dc2626">Σ</text>
    <line x1="220" y1="40" x2="220" y2="220" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="6 4"/>
    <rect x="220" y="200" width="18" height="18" fill="none" stroke="#6366f1" stroke-width="2"/>
    <text x="240" y="130" font-size="16" fill="#6366f1" font-weight="700">απόσταση</text>
    <circle cx="220" cy="220" r="4" fill="#1e293b"/>
