<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="t d"><title id="t">Η εξίσωση ως ζυγαριά σε ισορροπία</title><desc id="d">Μια ισορροπημένη ζυγαριά δείχνει x συν 3 στο αριστερό μέλος και 7 στο δεξί.</desc><rect width="900" height="390" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Η ισότητα πρέπει να παραμένει σε ισορροπία</text><g stroke="#29475c" stroke-width="7" fill="none"><path d="M450 100v190M300 315h300M210 145h480"/><path d="M270 145l-70 120h140zM630 145l-70 120h140z" stroke-width="4" fill="#dcecf8"/></g><circle cx="450" cy="145" r="16" fill="#d17a22"/><g font-family="Arial" text-anchor="middle" font-weight="700"><text x="270" y="240" font-size="34" fill="#173f63">x + 3</text><text x="630" y="240" font-size="34" fill="#176253">7</text><text x="450" y="365" font-size="22" fill="#29475c">Αφαιρούμε 3 και από τα δύο μέλη: x = 4</text></g></svg>
