<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="320" fill="#ffffff"/>

  <!-- Prism (rectangular box, isometric-ish) -->
  <g transform="translate(60,40)">
    <!-- bottom face -->
    <polygon points="0,180 120,180 160,140 40,140" fill="#dbeafe" stroke="#6366f1" stroke-width="2"/>
    <!-- top face -->
    <polygon points="0,40 120,40 160,0 40,0" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <!-- vertical edges -->
    <line x1="0" y1="40" x2="0" y2="180" stroke="#6366f1" stroke-width="2"/>
    <line x1="120" y1="40" x2="120" y2="180" stroke="#6366f1" stroke-width="2"/>
    <line x1="160" y1="0" x2="160" y2="140" stroke="#6366f1" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="140" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="-15" y="115" font-size="14" fill="#dc2626" font-weight="700">υ</text>
    <line x1="-8" y1="40" x2="-8" y2="180" stroke="#dc2626" stroke-width="1.5"/>
    <text x="60" y="215" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Πρίσμα</text>
    <text x="60" y="235" font-size="12" fill="#475569" text-anchor="middle">βάσεις πολύγωνα</text>
  </g>

  <!-- Cylinder -->
  <g transform="translate(400,40)">
    <ellipse cx="80" cy="180" rx="80" ry="24" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <ellipse cx="80" cy="20" rx="80" ry="24" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <line x1="0" y1="20" x2="0" y2="180" stroke="#10b981" stroke-width="2"/>
    <line x1="160" y1="20" x2="160" y2="180" stroke="#10b981" stroke-width="2"/>
    <text x="-15" y="105" font-size="14" fill="#dc2626" font-weight="700">υ</text>
    <line x1="-8" y1="20" x2="-8" y2="180" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="80" y1="180" x2="160" y2="180" stroke="#f59e0b" stroke-width="2"/>
    <text x="120" y="200" font-size="13" fill="#f59e0b" font-weight="700">r</text>
    <text x="80" y="215" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Κύλινδρος</text>
    <text x="80" y="235" font-size="13" fill="#475569" text-anchor="middle">βάσεις: κύκλοι ακτίνας r</text>
  </g>
</svg>
