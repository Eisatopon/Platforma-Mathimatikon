<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="480" fill="#ffffff"/>
  <!-- grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="60" x2="80" y2="400"/><line x1="160" y1="60" x2="160" y2="400"/>
    <line x1="240" y1="60" x2="240" y2="400"/><line x1="320" y1="60" x2="320" y2="400"/>
    <line x1="400" y1="60" x2="400" y2="400"/><line x1="480" y1="60" x2="480" y2="400"/>
    <line x1="560" y1="60" x2="560" y2="400"/>
    <line x1="80" y1="60" x2="560" y2="60"/><line x1="80" y1="120" x2="560" y2="120"/>
    <line x1="80" y1="180" x2="560" y2="180"/><line x1="80" y1="240" x2="560" y2="240"/>
    <line x1="80" y1="300" x2="560" y2="300"/><line x1="80" y1="360" x2="560" y2="360"/>
  </g>
  <!-- axes -->
  <line x1="80" y1="240" x2="560" y2="240" stroke="#1e293b" stroke-width="2"/>
  <line x1="320" y1="60" x2="320" y2="400" stroke="#1e293b" stroke-width="2"/>
  <polygon points="560,240 548,234 548,246" fill="#1e293b"/>
  <polygon points="320,60 314,72 326,72" fill="#1e293b"/>
  <text x="565" y="245" font-size="14" fill="#1e293b">x</text>
  <text x="325" y="58" font-size="14" fill="#1e293b">y</text>
  <text x="320" y="255" font-size="13" fill="#64748b" text-anchor="middle">0</text>

  <!-- line y=2x, through origin, points (-2,-4)...(2,4): scale 40px/unit -->
  <line x1="240" y1="320" x2="400" y2="160" stroke="#6366f1" stroke-width="3"/>
  <circle cx="320" cy="240" r="4" fill="#dc2626"/>
  <text x="335" y="235" font-size="14" fill="#dc2626" font-weight="700">(0,0)</text>
  <circle cx="360" cy="200" r="4" fill="#6366f1"/>
  <text x="372" y="195" font-size="14" fill="#6366f1" font-weight="700">(1,2)</text>

  <text x="320" y="440" font-size="17" fill="#475569" text-anchor="middle">Η ευθεία y=2x — πάντα περνάει από την αρχή (0,0)</text>
</svg>
