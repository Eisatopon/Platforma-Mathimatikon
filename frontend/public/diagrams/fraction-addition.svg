<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="t d"><title id="t">Πρόσθεση δύο τρίτων και ενός τετάρτου</title><desc id="d">Τα κλάσματα μετατρέπονται σε οκτώ δωδέκατα και τρία δωδέκατα και προστίθενται σε έντεκα δωδέκατα.</desc><rect width="900" height="370" rx="24" fill="#f5f8fb"/><text x="450" y="52" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Πρώτα δημιουργούμε ίσα κλασματικά μέρη</text><g font-family="Arial" text-anchor="middle"><text x="165" y="105" font-size="24" fill="#173f63">2/3 = 8/12</text><text x="450" y="105" font-size="24" fill="#9b4f11">1/4 = 3/12</text><text x="735" y="105" font-size="24" font-weight="700" fill="#176253">11/12</text><g stroke="#fff" stroke-width="2"><g fill="#2878a8"><rect x="55" y="135" width="18" height="70"/><rect x="73" y="135" width="18" height="70"/><rect x="91" y="135" width="18" height="70"/><rect x="109" y="135" width="18" height="70"/><rect x="127" y="135" width="18" height="70"/><rect x="145" y="135" width="18" height="70"/><rect x="163" y="135" width="18" height="70"/><rect x="181" y="135" width="18" height="70"/></g><rect x="199" y="135" width="72" height="70" fill="#dce6ec"/><g fill="#d17a22"><rect x="340" y="135" width="18" height="70"/><rect x="358" y="135" width="18" height="70"/><rect x="376" y="135" width="18" height="70"/></g><rect x="394" y="135" width="162" height="70" fill="#dce6ec"/><rect x="625" y="135" width="198" height="70" fill="#2b8f87"/><rect x="823" y="135" width="18" height="70" fill="#dce6ec"/></g><text x="450" y="280" font-size="27" font-weight="700" fill="#173f63">2/3 + 1/4 = 8/12 + 3/12 = 11/12</text></g></svg>
