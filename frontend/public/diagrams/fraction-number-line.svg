<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">Σύγκριση κλασμάτων στην αριθμογραμμή</title><desc id="d">Τα κλάσματα ένα δεύτερο, πέντε όγδοα και τρία τέταρτα φαίνονται από αριστερά προς τα δεξιά.</desc><rect width="900" height="330" rx="24" fill="#f5f8fb"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Δεξιότερα σημαίνει μεγαλύτερο</text><path d="M90 175H810" stroke="#29475c" stroke-width="5"/><g stroke="#29475c" stroke-width="3"><path d="M90 155v40M180 160v30M270 160v30M360 160v30M450 150v50M540 160v30M630 160v30M720 160v30M810 155v40"/></g><g font-family="Arial" text-anchor="middle" font-size="21" fill="#29475c"><text x="90" y="230">0</text><text x="810" y="230">1</text><circle cx="450" cy="175" r="11" fill="#2878a8"/><text x="450" y="135">1/2</text><circle cx="540" cy="175" r="11" fill="#2b8f87"/><text x="540" y="135">5/8</text><circle cx="630" cy="175" r="11" fill="#d17a22"/><text x="630" y="135">3/4</text><text x="540" y="290" font-size="25" font-weight="700" fill="#173f63">1/2 &lt; 5/8 &lt; 3/4</text></g></svg>
