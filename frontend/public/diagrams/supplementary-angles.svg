<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Παραπληρωματικές γωνίες 60° και 120° στον μοναδιαίο κύκλο</title>
<desc id="desc">Τα σημεία Μ=(1/2,√3/2) και Ν=(−1/2,√3/2) είναι συμμετρικά ως προς τον άξονα y. Έχουν ίσα ημίτονα και αντίθετα συνημίτονα και εφαπτομένες.</desc>
<rect width="760" height="470" rx="20" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#0f172a">
<text x="380" y="36" font-size="22" font-weight="700" text-anchor="middle">60° + 120° = 180°</text>
<path d="M 480 270 A 170 170 0 0 0 140 270" fill="none" stroke="#475569" stroke-width="2.5"/>
<g stroke="#64748b" stroke-width="1.5"><path d="M100 270H530m-10-5 10 5-10 5M310 325V65m-5 10 5-10 5 10" fill="none"/></g>
<g font-size="17"><text x="539" y="276">x</text><text x="322" y="72">y</text><text x="320" y="294">Ο</text><text x="140" y="295" text-anchor="middle">−1</text><text x="480" y="295" text-anchor="middle">1</text><text x="321" y="104">1</text></g>
<path d="M225 122.7756813566H395M310 270V122.7756813566" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="6 4"/>
<path d="M225 122.7756813566V270" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M395 122.7756813566V270" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M310 270H395M310 270L395 122.7756813566" stroke="#b45309" stroke-width="3"/>
<path d="M310 270H225M310 270L225 122.7756813566" stroke="#7c3aed" stroke-width="3"/>
<path d="M350 270A40 40 0 0 0 330 235.3589838486" fill="none" stroke="#b45309" stroke-width="2"/>
<path d="M368 270A58 58 0 0 0 281 219.7705265805" fill="none" stroke="#7c3aed" stroke-width="2"/>
<circle cx="395" cy="122.7756813566" r="6" fill="#b45309"/><circle cx="225" cy="122.7756813566" r="6" fill="#7c3aed"/>
<g font-size="20" font-weight="700"><text x="407" y="116" fill="#92400e">Μ</text><text x="198" y="116" fill="#6d28d9">Ν</text></g>
<g font-size="17"><text x="395" y="315" text-anchor="middle" fill="#92400e">1/2</text><text x="225" y="315" text-anchor="middle" fill="#6d28d9">−1/2</text><text x="452" y="148" fill="#0f766e">y = √3/2</text></g>
<g font-size="19" text-anchor="middle"><text x="380" y="365">Μ = (1/2, √3/2) · Ν = (−1/2, √3/2)</text><text x="380" y="400" fill="#0f766e">Ίδια τεταγμένη · αντίθετες τετμημένες</text><text x="380" y="435" font-size="17">ημ120° = ημ60° · συν120° = −συν60° · εφ120° = −εφ60°</text></g>
</g></svg>
