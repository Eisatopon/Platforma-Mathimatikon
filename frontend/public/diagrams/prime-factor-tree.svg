<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Δέντρο πρώτων παραγόντων του 84</title><desc id="desc">Ο αριθμός 84 διασπάται σε 12 επί 7, το 12 σε 3 επί 4 και το 4 σε 2 επί 2.</desc><rect width="900" height="420" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#173f63">Ανάλυση του 84 σε πρώτους παράγοντες</text><g stroke="#7895a8" stroke-width="4"><path d="M450 105L320 175M450 105l130 70M320 205l-90 65M320 205l90 65M410 300l-55 58M410 300l55 58"/></g><g font-family="Arial" text-anchor="middle" font-size="27" font-weight="700"><g fill="#dcecf8" stroke="#1f4e7b" stroke-width="3"><circle cx="450" cy="95" r="40"/><circle cx="320" cy="195" r="36"/><circle cx="410" cy="290" r="34"/></g><g fill="#dff3ec" stroke="#24806f" stroke-width="3"><circle cx="580" cy="195" r="36"/><circle cx="230" cy="290" r="34"/><circle cx="355" cy="370" r="31"/><circle cx="465" cy="370" r="31"/></g><g fill="#173f63"><text x="450" y="105">84</text><text x="320" y="205">12</text><text x="410" y="300">4</text></g><g fill="#176253"><text x="580" y="205">7</text><text x="230" y="300">3</text><text x="355" y="380">2</text><text x="465" y="380">2</text></g><text x="700" y="295" font-size="25" fill="#243b4a">84 = 2² · 3 · 7</text><text x="700" y="330" font-size="18" font-weight="400" fill="#536d7d">όλα τα φύλλα είναι πρώτοι</text></g></svg>
