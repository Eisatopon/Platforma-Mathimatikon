<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Η διακρίνουσα και οι τομές παραβολής</title><desc id="d">Τρεις παραβολές με δύο τομές, μία επαφή και καμία τομή με τον άξονα χ, για θετική, μηδενική και αρνητική διακρίνουσα.</desc><rect width="900" height="360" fill="#f8fafc"/><text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">Διακρίνουσα και πραγματικές ρίζες</text><g stroke="#64748b" stroke-width="2"><path d="M40 230H280M160 65V300M330 230H570M450 65V300M620 230H860M740 65V300"/></g><g fill="none" stroke-width="5"><path d="M65 90Q160 360 255 90" stroke="#2563eb"/><path d="M355 70Q450 230 545 70" stroke="#16a34a"/><path d="M645 45Q740 190 835 45" stroke="#dc2626"/></g><g font-family="Arial" text-anchor="middle"><text x="160" y="330" font-size="21" fill="#2563eb">Δ &gt; 0: δύο ρίζες</text><text x="450" y="330" font-size="21" fill="#16a34a">Δ = 0: διπλή ρίζα</text><text x="740" y="330" font-size="21" fill="#dc2626">Δ &lt; 0: καμία</text></g></svg>
