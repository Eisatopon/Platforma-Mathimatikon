<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="t d"><title id="t">Αναγωγή στη μονάδα</title><desc id="d">Από οκτώ μέτρα που κοστίζουν πενήντα δύο ευρώ βρίσκουμε ότι ένα μέτρο κοστίζει έξι και μισό ευρώ και πέντε μέτρα τριάντα δύο και μισό ευρώ.</desc><rect width="900" height="350" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Αναγωγή πρώτα στη μία μονάδα</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="110" width="220" height="100" rx="16" fill="#dcecf8" stroke="#2878a8" stroke-width="3"/><text x="165" y="151" font-size="23" fill="#173f63">8 m</text><text x="165" y="189" font-size="27" font-weight="700" fill="#173f63">52 €</text><rect x="340" y="110" width="220" height="100" rx="16" fill="#fff0d8" stroke="#d17a22" stroke-width="3"/><text x="450" y="151" font-size="23" fill="#9b4f11">1 m</text><text x="450" y="189" font-size="27" font-weight="700" fill="#9b4f11">6,5 €</text><rect x="625" y="110" width="220" height="100" rx="16" fill="#dff3ec" stroke="#2b8f87" stroke-width="3"/><text x="735" y="151" font-size="23" fill="#176253">5 m</text><text x="735" y="189" font-size="27" font-weight="700" fill="#176253">32,5 €</text><path d="M280 160h45M565 160h45" stroke="#627d90" stroke-width="5"/><text x="302" y="245" font-size="19" fill="#536d7d">÷8</text><text x="588" y="245" font-size="19" fill="#536d7d">×5</text><text x="450" y="307" font-size="22" fill="#29475c">Η τιμή μονάδας κάνει τη σχέση διαφανή.</text></g></svg>
