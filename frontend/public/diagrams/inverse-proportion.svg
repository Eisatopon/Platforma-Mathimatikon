<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">Γραφική παράσταση αντίστροφης αναλογίας</title><desc id="d">Στο πρώτο τεταρτημόριο φαίνεται φθίνουσα καμπύλη y ίσον δώδεκα διά x που πλησιάζει τους άξονες.</desc><rect width="900" height="440" rx="24" fill="#f5f8fb"/><text x="450" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Αντίστροφη αναλογία: xy = 12</text><g transform="translate(110 350)"><path d="M0 0H680M0 0V-270" stroke="#29475c" stroke-width="4"/><path d="M670 -10l18 10-18 10M-10 -260l10-18 10 18" fill="#29475c"/><path d="M45 -250C80 -145 135 -93 215 -62S420 -31 640 -20" fill="none" stroke="#2b8f87" stroke-width="7"/><g fill="#d17a22"><circle cx="80" cy="-180" r="8"/><circle cx="160" cy="-90" r="8"/><circle cx="240" cy="-60" r="8"/><circle cx="480" cy="-30" r="8"/></g><g font-family="Arial" font-size="18" fill="#29475c"><text x="695" y="7">x</text><text x="-25" y="-285">y</text><text x="78" y="28">1</text><text x="158" y="28">2</text><text x="238" y="28">3</text><text x="478" y="28">6</text><text x="25" y="-178">12</text><text x="25" y="-88">6</text></g></g><text x="650" y="100" font-family="Arial" font-size="24" font-weight="700" fill="#176253">y = 12/x</text></svg>
