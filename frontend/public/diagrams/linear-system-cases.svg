<svg xmlns="http://www.w3.org/2000/svg" width="930" height="380" viewBox="0 0 930 380" role="img" aria-labelledby="t d"><title id="t">Οι τρεις περιπτώσεις γραμμικού συστήματος</title><desc id="d">Τεμνόμενες ευθείες με μία λύση, παράλληλες χωρίς λύση και ταυτόσημες με άπειρες λύσεις.</desc><rect width="930" height="380" fill="#f8fafc"/><text x="465" y="38" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Γραφική επίλυση συστήματος</text><g stroke="#94a3b8" stroke-width="2"><path d="M35 210H285M160 70V310M340 210H590M465 70V310M645 210H895M770 70V310"/></g><g fill="none" stroke-width="6"><path d="M65 285L255 95" stroke="#2563eb"/><path d="M65 95L255 285" stroke="#dc2626"/><path d="M365 270L565 110M365 310L565 150" stroke="#2563eb"/><path d="M675 285L865 95" stroke="#7c3aed"/><path d="M675 285L865 95" stroke="#16a34a" stroke-dasharray="12 9"/></g><g font-family="Arial" text-anchor="middle" font-size="20"><text x="160" y="345">1 λύση</text><text x="465" y="345">Καμία λύση</text><text x="770" y="345">Άπειρες λύσεις</text></g></svg>
