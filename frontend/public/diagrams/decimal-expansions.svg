<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="t d"><title id="t">Πεπερασμένη και περιοδική δεκαδική ανάπτυξη</title><desc id="d">Το επτά εικοστά γίνεται 0,35 και το δεκατρία τριακοστά γίνεται 0,4333 με επανάληψη του 3.</desc><rect width="900" height="350" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Δύο μορφές δεκαδικής ανάπτυξης</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="95" width="340" height="170" rx="18" fill="#dff3ec" stroke="#2b8f87" stroke-width="3"/><text x="240" y="140" font-size="21" fill="#176253">Πεπερασμένη</text><text x="240" y="200" font-size="35" font-weight="700" fill="#176253">7/20 = 0,35</text><rect x="490" y="95" width="340" height="170" rx="18" fill="#fff0d8" stroke="#d17a22" stroke-width="3"/><text x="660" y="140" font-size="21" fill="#9b4f11">Περιοδική</text><text x="660" y="200" font-size="32" font-weight="700" fill="#9b4f11">13/30 = 0,4333…</text><text x="450" y="315" font-size="20" fill="#29475c">Στην περιοδική ανάπτυξη μια ομάδα ψηφίων επαναλαμβάνεται χωρίς τέλος.</text></g></svg>
