<svg viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="680" height="440" fill="#ffffff"/>
  <!-- Equilateral -->
  <g transform="translate(60,40)">
    <polygon points="80,20 20,140 140,140" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="80" y="170" font-size="16" fill="#475569" text-anchor="middle">Ισόπλευρο</text>
    <text x="80" y="192" font-size="13" fill="#94a3b8" text-anchor="middle">(3 ίσες πλευρές)</text>
  </g>
  <!-- Isosceles -->
  <g transform="translate(280,40)">
    <polygon points="80,20 10,140 150,140" fill="#dbeafe" stroke="#6366f1" stroke-width="2.5"/>
    <text x="80" y="170" font-size="16" fill="#475569" text-anchor="middle">Ισοσκελές</text>
    <text x="80" y="192" font-size="13" fill="#94a3b8" text-anchor="middle">(2 ίσες πλευρές)</text>
  </g>
  <!-- Scalene -->
  <g transform="translate(500,40)">
    <polygon points="40,20 0,140 160,110" fill="#dcfce7" stroke="#10b981" stroke-width="2.5"/>
    <text x="80" y="170" font-size="16" fill="#475569" text-anchor="middle">Σκαληνό</text>
    <text x="80" y="192" font-size="13" fill="#94a3b8" text-anchor="middle">(καμία ίση πλευρά)</text>
  </g>
  <!-- Right triangle -->
  <g transform="translate(170,230)">
    <polygon points="10,10 10,130 160,130" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
    <rect x="10" y="110" width="18" height="18" fill="none" stroke="#db2777" stroke-width="2"/>
    <text x="85" y="165" font-size="16" fill="#475569" text-anchor="middle">Ορθογώνιο</text>
    <text x="85" y="187" font-size="13" fill="#94a3b8" text-anchor="middle">(μία γωνία 90°)</text>
  </g>
  <!-- Obtuse triangle -->
  <g transform="translate(400,230)">
    <polygon points="20,20 0,130 170,130" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="85" y="165" font-size="16" fill="#475569" text-anchor="middle">Αμβλυγώνιο</text>
    <text x="85" y="187" font-size="13" fill="#94a3b8" text-anchor="middle">(μία γωνία &gt;90°)</text>
  </g>
</svg>
