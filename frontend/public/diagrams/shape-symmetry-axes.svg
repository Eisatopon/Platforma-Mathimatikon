<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">Άξονες συμμετρίας γνωστών σχημάτων</title><desc id="d">Ισοσκελές τρίγωνο με έναν άξονα, ορθογώνιο με δύο, τετράγωνο με τέσσερις και κύκλος με άπειρους άξονες συμμετρίας.</desc><rect width="1000" height="420" rx="24" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Πόσους άξονες συμμετρίας έχει κάθε σχήμα;</text><g fill="#eaf4fb" stroke="#1f4e7b" stroke-width="5"><path d="M55 300L145 105l90 195z"/><rect x="300" y="125" width="180" height="150" rx="4"/><rect x="560" y="115" width="165" height="165" rx="4"/><circle cx="870" cy="198" r="92"/></g><g stroke="#e76f51" stroke-width="4" stroke-dasharray="10 7"><path d="M145 75V330"/><path d="M390 90V315M270 200H510"/><path d="M642 80V315M525 198H760M545 100L740 295M740 100L545 295"/><path d="M870 75V320M747 198H993M783 111L957 285M957 111L783 285"/></g><g font-family="Arial" fill="#17324d" text-anchor="middle"><text x="145" y="365" font-size="22">1 άξονας</text><text x="390" y="365" font-size="22">2 άξονες</text><text x="642" y="365" font-size="22">4 άξονες</text><text x="870" y="365" font-size="22">άπειροι</text></g><path d="M260 70V380M520 70V380M780 70V380" stroke="#cbd5e1" stroke-width="2"/></svg>
