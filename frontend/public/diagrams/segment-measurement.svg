<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">Μέτρηση ευθύγραμμου τμήματος</title><desc id="d">Το τμήμα ΑΒ τοποθετείται πάνω από χάρακα με το Α στο μηδέν και το Β στην ένδειξη 6,4 εκατοστά.</desc><rect width="900" height="330" rx="24" fill="#f8fafc"/><text x="450" y="45" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">Μετρώ από το 0 και γράφω μονάδα</text><path d="M130 115H770" stroke="#1f4e7b" stroke-width="7"/><circle cx="130" cy="115" r="9" fill="#e76f51"/><circle cx="770" cy="115" r="9" fill="#e76f51"/><g font-family="Arial" font-size="22" fill="#17324d"><text x="120" y="95">A</text><text x="765" y="95">B</text><text x="450" y="305" text-anchor="middle" font-weight="700">AB = 6,4 cm</text></g><rect x="110" y="165" width="700" height="90" rx="8" fill="#fff4d6" stroke="#d6a63c" stroke-width="3"/><g stroke="#17324d" stroke-width="2"><path d="M130 165v55M230 165v55M330 165v55M430 165v55M530 165v55M630 165v55M730 165v55"/><path d="M140 165v25M150 165v25M160 165v25M170 165v25M180 165v25M190 165v25M200 165v25M210 165v25M220 165v25M740 165v25M750 165v25M760 165v25M770 165v55M780 165v25M790 165v25"/></g><g font-family="Arial" font-size="18" fill="#17324d"><text x="125" y="243">0</text><text x="225" y="243">1</text><text x="325" y="243">2</text><text x="425" y="243">3</text><text x="525" y="243">4</text><text x="625" y="243">5</text><text x="725" y="243">6</text><text x="775" y="243">cm</text></g><path d="M130 135V165M770 135V165" stroke="#e76f51" stroke-width="3" stroke-dasharray="5 4"/></svg>
