<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-labelledby="title desc">
  <title id="title">Καρτεσιανό επίπεδο και τεταρτημόρια</title>
  <desc id="desc">Άξονες x και y, τέσσερα τεταρτημόρια και παραδείγματα σημείων με διαφορετικά πρόσημα συντεταγμένων.</desc>
  <rect width="700" height="560" rx="24" fill="#ffffff"/>
  <g stroke="#e1e8f0" stroke-width="1">
    <path d="M70 80V500M140 80V500M210 80V500M280 80V500M350 80V500M420 80V500M490 80V500M560 80V500M630 80V500"/>
    <path d="M70 80H630M70 150H630M70 220H630M70 290H630M70 360H630M70 430H630M70 500H630"/>
  </g>
  <path d="M60 290H645M350 515V65" stroke="#263b50" stroke-width="4"/>
  <path d="M645 290l-16-9v18zM350 65l-9 16h18z" fill="#263b50"/>
  <g font-family="Arial" font-size="22" fill="#173f6b" font-weight="700">
    <text x="650" y="298">x</text><text x="362" y="70">y</text>
    <text x="505" y="125">I (+,+)</text><text x="125" y="125">II (−,+)</text>
    <text x="115" y="465">III (−,−)</text><text x="495" y="465">IV (+,−)</text>
  </g>
  <g fill="#e36b3d" font-family="Arial" font-size="19">
    <circle cx="490" cy="150" r="7"/><text x="505" y="145">(2,2)</text>
    <circle cx="210" cy="220" r="7"/><text x="120" y="215">(−2,1)</text>
    <circle cx="490" cy="430" r="7"/><text x="505" y="425">(2,−2)</text>
  </g>
  <text x="350" y="545" text-anchor="middle" font-family="Arial" font-size="21" fill="#51677c">Πρώτα διαβάζουμε το x, έπειτα το y</text>
</svg>
