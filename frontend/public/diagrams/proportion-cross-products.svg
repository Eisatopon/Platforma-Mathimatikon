<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="t d"><title id="t">Χιαστί γινόμενα σε αναλογία</title><desc id="d">Η αναλογία τρία πέμπτα ίσον δώδεκα εικοστά συνδέεται με τα ίσα χιαστί γινόμενα εξήντα.</desc><rect width="900" height="350" rx="24" fill="#f5f8fb"/><text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Θεμελιώδης ιδιότητα αναλογίας</text><g font-family="Arial" text-anchor="middle"><text x="280" y="170" font-size="52" fill="#173f63">3</text><path d="M235 184h90" stroke="#29475c" stroke-width="4"/><text x="280" y="235" font-size="52" fill="#173f63">5</text><text x="450" y="205" font-size="48" fill="#29475c">=</text><text x="620" y="170" font-size="52" fill="#176253">12</text><path d="M565 184h110" stroke="#29475c" stroke-width="4"/><text x="620" y="235" font-size="52" fill="#176253">20</text><path d="M315 145Q450 70 585 215M315 215Q450 290 585 145" fill="none" stroke="#d17a22" stroke-width="5"/><text x="450" y="320" font-size="25" font-weight="700" fill="#9b4f11">3 · 20 = 5 · 12 = 60</text></g></svg>
