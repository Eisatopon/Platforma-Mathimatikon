<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Ραβδόγραμμα εξίσωσης x συν 2x ίσον 54</title><desc id="d">Η πρώτη ποσότητα είναι ένα ίσο τμήμα x και η δεύτερη δύο ίσα τμήματα x, με συνολικό μήκος 54.</desc><rect width="900" height="360" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Μία ποσότητα και το διπλάσιό της</text><g font-family="Arial"><text x="115" y="130" text-anchor="end" font-size="21" fill="#29475c">1ο κουτί</text><rect x="145" y="92" width="210" height="58" rx="8" fill="#2878a8"/><text x="250" y="130" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">x</text><text x="115" y="220" text-anchor="end" font-size="21" fill="#29475c">2ο κουτί</text><rect x="145" y="182" width="210" height="58" rx="8" fill="#2b8f87"/><rect x="355" y="182" width="210" height="58" rx="8" fill="#2b8f87" stroke="#fff" stroke-width="3"/><text x="250" y="220" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">x</text><text x="460" y="220" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">x</text><path d="M145 275v22M565 275v22M145 286h420" stroke="#d17a22" stroke-width="4"/><text x="355" y="330" text-anchor="middle" font-size="23" font-weight="700" fill="#9b4f11">Σύνολο 54 → x + 2x = 54</text></g></svg>
