<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="480" fill="#ffffff"/>
  <!-- axes -->
  <line x1="80" y1="380" x2="580" y2="380" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="80" y1="380" x2="80" y2="60" stroke="#1e293b" stroke-width="2.5"/>
  <!-- y-axis labels -->
  <text x="65" y="385" font-size="14" fill="#64748b" text-anchor="end">0</text>
  <text x="65" y="305" font-size="14" fill="#64748b" text-anchor="end">5</text>
  <text x="65" y="225" font-size="14" fill="#64748b" text-anchor="end">10</text>
  <text x="65" y="145" font-size="14" fill="#64748b" text-anchor="end">15</text>
  <text x="65" y="65" font-size="14" fill="#64748b" text-anchor="end">20</text>
  <line x1="75" y1="300" x2="80" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="75" y1="220" x2="80" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="75" y1="140" x2="80" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="75" y1="60" x2="80" y2="60" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- bars: Ποδόσφαιρο 18, Μπάσκετ 12, Βόλεϊ 6, Άλλο 4  (scale: 16px per unit, base at y=380) -->
  <rect x="130" y="92" width="80" height="288" fill="#6366f1"/>
  <text x="170" y="80" font-size="16" font-weight="700" fill="#6366f1" text-anchor="middle">18</text>
  <text x="170" y="405" font-size="14" fill="#1e293b" text-anchor="middle">Ποδόσφαιρο</text>

  <rect x="250" y="188" width="80" height="192" fill="#10b981"/>
  <text x="290" y="176" font-size="16" font-weight="700" fill="#10b981" text-anchor="middle">12</text>
  <text x="290" y="405" font-size="14" fill="#1e293b" text-anchor="middle">Μπάσκετ</text>

  <rect x="370" y="284" width="80" height="96" fill="#f59e0b"/>
  <text x="410" y="272" font-size="16" font-weight="700" fill="#f59e0b" text-anchor="middle">6</text>
  <text x="410" y="405" font-size="14" fill="#1e293b" text-anchor="middle">Βόλεϊ</text>

  <rect x="490" y="316" width="80" height="64" fill="#a855f7"/>
  <text x="530" y="304" font-size="16" font-weight="700" fill="#a855f7" text-anchor="middle">4</text>
  <text x="530" y="405" font-size="14" fill="#1e293b" text-anchor="middle">Άλλο</text>

  <text x="30" y="220" font-size="14" fill="#64748b" text-anchor="middle" transform="rotate(-90,30,220)">Συχνότητα (μαθητές)</text>
  <text x="320" y="440" font-size="17" fill="#475569" text-anchor="middle">Ραβδόγραμμα: αγαπημένο άθλημα 40 μαθητών</text>
</svg>
