<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>

  <!-- Panel 1: basic sets A, B with intersection -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="220" height="200" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="8" y="18" font-size="13" fill="#64748b">Ω (σύνολο αναφοράς)</text>
    <circle cx="80" cy="105" r="65" fill="#6366f1" fill-opacity="0.25" stroke="#6366f1" stroke-width="2.5"/>
    <circle cx="150" cy="105" r="65" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2.5"/>
    <text x="50" y="75" font-size="18" fill="#6366f1" font-weight="700">A</text>
    <text x="175" y="75" font-size="18" fill="#10b981" font-weight="700">B</text>
    <text x="110" y="110" font-size="13" fill="#1e293b" text-anchor="middle">A∩B</text>
    <text x="110" y="240" font-size="14" fill="#475569" text-anchor="middle">Σύνολα Α, Β</text>
  </g>

  <!-- Panel 2: Union A∪B highlighted -->
  <g transform="translate(260,20)">
    <rect x="0" y="0" width="220" height="200" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <defs>
      <clipPath id="clipA"><circle cx="80" cy="105" r="65"/></clipPath>
      <clipPath id="clipB"><circle cx="150" cy="105" r="65"/></clipPath>
    </defs>
    <circle cx="80" cy="105" r="65" fill="#f59e0b" fill-opacity="0.35"/>
    <circle cx="150" cy="105" r="65" fill="#f59e0b" fill-opacity="0.35"/>
    <circle cx="80" cy="105" r="65" fill="none" stroke="#6366f1" stroke-width="2.5"/>
    <circle cx="150" cy="105" r="65" fill="none" stroke="#10b981" stroke-width="2.5"/>
    <text x="110" y="235" font-size="14" fill="#475569" text-anchor="middle">Ένωση A∪B (όλο το χρωματιστό)</text>
  </g>

  <!-- Panel 3: Intersection only highlighted -->
  <g transform="translate(500,20)">
    <rect x="0" y="0" width="160" height="200" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="55" cy="105" r="50" fill="none" stroke="#6366f1" stroke-width="2"/>
    <circle cx="105" cy="105" r="50" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 80 65 A 50 50 0 0 1 80 145 A 50 50 0 0 1 80 65 Z" fill="#dc2626" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.5"/>
    <text x="80" y="235" font-size="14" fill="#475569" text-anchor="middle">Τομή A∩B</text>
  </g>
</svg>