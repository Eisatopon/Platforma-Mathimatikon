<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">Τυποποιημένη μορφή πολύ μικρού αριθμού</title><desc id="d">Ο δεκαδικός 0,0000062 γράφεται 6,2 επί 10 στη μείον έκτη.</desc><rect width="900" height="330" rx="24" fill="#f5f8fb"/><text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Τυποποιημένη μορφή πολύ μικρού αριθμού</text><g font-family="Arial" text-anchor="middle"><text x="260" y="160" font-size="39" font-weight="700" fill="#243b4a">0,0000062</text><path d="M425 145h100" stroke="#d17a22" stroke-width="6"/><path d="M515 132l22 13-22 13" fill="#d17a22"/><text x="680" y="160" font-size="42" font-weight="700" fill="#176253">6,2 · 10⁻⁶</text><text x="450" y="235" font-size="21" fill="#29475c">Μετακινούμε την υποδιαστολή 6 θέσεις δεξιά.</text><text x="450" y="285" font-size="21" font-weight="700" fill="#9b4f11">Ο αριθμός είναι μικρότερος από 1 → αρνητικός εκθέτης</text></g></svg>
