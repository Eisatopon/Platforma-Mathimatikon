<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="t d"><title id="t">Κλίμακα μετρικών μονάδων μήκους</title><desc id="d">Από τα χιλιόμετρα ως τα χιλιοστά, κάθε βήμα προς τα δεξιά πολλαπλασιάζει επί δέκα και προς τα αριστερά διαιρεί διά δέκα.</desc><rect width="900" height="390" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Κλίμακα μονάδων μήκους</text><g font-family="Arial" text-anchor="middle"><g font-size="23" font-weight="700" fill="#fff"><rect x="65" y="135" width="110" height="70" rx="10" fill="#1f4e7b"/><rect x="175" y="135" width="110" height="70" rx="10" fill="#2878a8"/><rect x="285" y="135" width="110" height="70" rx="10" fill="#2b8f87"/><rect x="395" y="135" width="110" height="70" rx="10" fill="#488d63"/><rect x="505" y="135" width="110" height="70" rx="10" fill="#b59628"/><rect x="615" y="135" width="110" height="70" rx="10" fill="#d17a22"/><rect x="725" y="135" width="110" height="70" rx="10" fill="#b44755"/><text x="120" y="178">km</text><text x="230" y="178">hm</text><text x="340" y="178">dam</text><text x="450" y="178">m</text><text x="560" y="178">dm</text><text x="670" y="178">cm</text><text x="780" y="178">mm</text></g><path d="M115 105h665" stroke="#d17a22" stroke-width="5"/><path d="M770 93l22 12-22 12" fill="#d17a22"/><text x="450" y="92" font-size="21" fill="#9b4f11">προς μικρότερη μονάδα: ×10 σε κάθε βήμα</text><path d="M785 250H120" stroke="#2878a8" stroke-width="5"/><path d="M130 238l-22 12 22 12" fill="#2878a8"/><text x="450" y="292" font-size="21" fill="#173f63">προς μεγαλύτερη μονάδα: ÷10 σε κάθε βήμα</text><text x="450" y="348" font-size="23" font-weight="700" fill="#29475c">3,75 m = 375 cm</text></g></svg>
