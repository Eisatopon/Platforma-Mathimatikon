<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">Κέντρα συμμετρίας γνωστών σχημάτων</title><desc id="d">Παραλληλόγραμμο, ορθογώνιο και κανονικό εξάγωνο έχουν σημειωμένο κέντρο συμμετρίας, ενώ το ισόπλευρο τρίγωνο δεν έχει.</desc><rect width="1000" height="420" rx="24" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Κέντρο συμμετρίας σημαίνει σύμπτωση μετά από στροφή 180°</text><g fill="#eaf4fb" stroke="#1f4e7b" stroke-width="5"><path d="M45 280L95 125h170l-50 155z"/><rect x="305" y="125" width="190" height="155" rx="4"/><path d="M570 200l55-95h110l55 95-55 95H625z"/><path d="M835 290L915 105l80 185z"/></g><g stroke="#2a9d8f" stroke-width="3" stroke-dasharray="8 6"><path d="M45 280L265 125M95 125L215 280"/><path d="M305 125L495 280M495 125L305 280"/><path d="M570 200H790M625 105L735 295M735 105L625 295"/></g><g fill="#e63946"><circle cx="155" cy="202.5" r="9"/><circle cx="400" cy="202.5" r="9"/><circle cx="680" cy="200" r="9"/></g><g font-family="Arial" fill="#17324d" text-anchor="middle"><text x="155" y="350" font-size="21">κέντρο: τομή διαγωνίων</text><text x="400" y="350" font-size="21">κέντρο: τομή διαγωνίων</text><text x="680" y="350" font-size="21">έχει κέντρο</text><text x="915" y="350" font-size="21" fill="#b42318">δεν έχει κέντρο</text></g><path d="M280 75V375M520 75V375M815 75V375" stroke="#cbd5e1" stroke-width="2"/></svg>
