<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-labelledby="t d"><title id="t">Ορθογώνιο που οδηγεί σε εξίσωση δευτέρου βαθμού</title><desc id="d">Ορθογώνιο με πλάτος χ, μήκος χ συν τρία και εμβαδόν πενήντα τέσσερα.</desc><rect width="820" height="360" fill="#f8fafc"/><text x="410" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">Από το σχήμα στην εξίσωση</text><rect x="190" y="90" width="440" height="200" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="5"/><g font-family="Arial" font-size="25" text-anchor="middle" fill="#0f172a"><text x="410" y="82">x + 3</text><text x="155" y="198">x</text><text x="410" y="190" font-size="31" font-weight="700">E = 54</text><text x="410" y="335">x(x+3)=54</text></g></svg>
