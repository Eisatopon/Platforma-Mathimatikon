<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">Ισοδύναμα κλάσματα ένα δεύτερο, δύο τέταρτα και τρία έκτα</title><desc id="d">Τρεις ίσες λωρίδες έχουν χρωματισμένο το αριστερό μισό με διαφορετικές διαιρέσεις.</desc><rect width="900" height="400" rx="24" fill="#f5f8fb"/><text x="450" y="52" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Ίδια ποσότητα — διαφορετικός χωρισμός</text><g font-family="Arial" font-size="25" text-anchor="end" fill="#29475c"><text x="155" y="130">1/2</text><text x="155" y="220">2/4</text><text x="155" y="310">3/6</text></g><g stroke="#fff" stroke-width="3"><rect x="185" y="90" width="280" height="60" fill="#2878a8"/><rect x="465" y="90" width="280" height="60" fill="#dce6ec"/><rect x="185" y="180" width="140" height="60" fill="#2878a8"/><rect x="325" y="180" width="140" height="60" fill="#2878a8"/><rect x="465" y="180" width="140" height="60" fill="#dce6ec"/><rect x="605" y="180" width="140" height="60" fill="#dce6ec"/><g><rect x="185" y="270" width="93.3" height="60" fill="#2878a8"/><rect x="278.3" y="270" width="93.3" height="60" fill="#2878a8"/><rect x="371.6" y="270" width="93.4" height="60" fill="#2878a8"/><rect x="465" y="270" width="93.3" height="60" fill="#dce6ec"/><rect x="558.3" y="270" width="93.3" height="60" fill="#dce6ec"/><rect x="651.6" y="270" width="93.4" height="60" fill="#dce6ec"/></g></g><text x="465" y="375" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#176253">1/2 = 2/4 = 3/6</text></svg>
