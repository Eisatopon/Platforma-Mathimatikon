<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="560" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <!-- vector a: A to B -->
  <line x1="60" y1="220" x2="240" y2="120" stroke="#6366f1" stroke-width="3.5" marker-end="url(#a1)"/>
  <text x="130" y="155" font-size="17" fill="#6366f1" font-weight="700">α</text>
  <!-- vector b: B to C -->
  <line x1="240" y1="120" x2="400" y2="220" stroke="#10b981" stroke-width="3.5" marker-end="url(#a2)"/>
  <text x="330" y="160" font-size="17" fill="#10b981" font-weight="700">β</text>
  <!-- vector a+b: A to C -->
  <line x1="60" y1="220" x2="400" y2="220" stroke="#dc2626" stroke-width="3.5" marker-end="url(#a3)"/>
  <text x="220" y="250" font-size="17" fill="#dc2626" font-weight="700" text-anchor="middle">α + β</text>

  <text x="45" y="240" font-size="14" fill="#1e293b" font-weight="700">Α</text>
  <text x="240" y="110" font-size="14" fill="#1e293b" font-weight="700">Β</text>
  <text x="405" y="230" font-size="14" fill="#1e293b" font-weight="700">Γ</text>

  <text x="280" y="285" font-size="14" fill="#475569" text-anchor="middle">Κανόνας τριγώνου: το άθροισμα ενώνει αρχή του α με τέλος του β</text>
</svg>
