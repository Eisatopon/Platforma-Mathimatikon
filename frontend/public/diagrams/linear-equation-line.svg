<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="t d"><title id="t">Η εξίσωση x συν y ίσον έξι ως ευθεία</title><desc id="d">Καρτεσιανό επίπεδο με ευθεία που περνά από τα σημεία μηδέν έξι, τρία τρία και έξι μηδέν.</desc><rect width="820" height="440" fill="#f8fafc"/><text x="410" y="35" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">x + y = 6</text><g transform="translate(100 370)" stroke="#334155" stroke-width="3"><path d="M0 0H650M0 0V-310"/><path d="M40 -280L600 -20" stroke="#2563eb" stroke-width="6"/></g><g fill="#dc2626" stroke="#fff" stroke-width="2"><circle cx="140" cy="90" r="8"/><circle cx="420" cy="220" r="8"/><circle cx="700" cy="350" r="8"/></g><g font-family="Arial" font-size="20" fill="#0f172a"><text x="150" y="82">(0,6)</text><text x="430" y="212">(3,3)</text><text x="675" y="340">(6,0)</text><text x="755" y="385">x</text><text x="82" y="70">y</text></g></svg>
