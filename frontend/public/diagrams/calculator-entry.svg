<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="t d"><title id="t">Διαδικασία σωστής χρήσης υπολογιστή τσέπης</title><desc id="d">Τρία βήματα: εκτίμηση, πιστή πληκτρολόγηση με παρενθέσεις και έλεγχος αποτελέσματος.</desc><rect width="900" height="350" rx="24" fill="#f5f8fb"/><text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Ο υπολογιστής επιβεβαιώνει — δεν αποφασίζει</text><g font-family="Arial" text-anchor="middle"><g><rect x="45" y="105" width="230" height="135" rx="18" fill="#dcecf8" stroke="#2878a8" stroke-width="3"/><text x="160" y="148" font-size="20" fill="#29475c">1. Εκτίμηση</text><text x="160" y="195" font-size="25" font-weight="700" fill="#173f63">≈ 20</text></g><g><rect x="335" y="105" width="230" height="135" rx="18" fill="#fff0d8" stroke="#d17a22" stroke-width="3"/><text x="450" y="148" font-size="20" fill="#7c4a19">2. Πληκτρολόγηση</text><text x="450" y="195" font-size="23" font-weight="700" fill="#9b4f11">( 48,6 ÷ 2,4 )</text></g><g><rect x="625" y="105" width="230" height="135" rx="18" fill="#dff3ec" stroke="#2b8f87" stroke-width="3"/><text x="740" y="148" font-size="20" fill="#176253">3. Έλεγχος</text><text x="740" y="195" font-size="25" font-weight="700" fill="#176253">20,25 ✓</text></g><path d="M280 172h40M570 172h40" stroke="#627d90" stroke-width="5"/><text x="450" y="300" font-size="22" fill="#29475c">Αν το αποτέλεσμα απέχει πολύ από την εκτίμηση, ελέγχουμε τα πλήκτρα.</text></g></svg>
