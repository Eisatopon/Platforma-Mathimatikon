<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Πίνακας αξίας θέσης του αριθμού 46.283</title><desc id="desc">Τα ψηφία 4, 6, 2, 8 και 3 τοποθετούνται σε δεκάδες χιλιάδων, χιλιάδες, εκατοντάδες, δεκάδες και μονάδες.</desc>
  <rect width="900" height="360" rx="24" fill="#f4f8fc"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#173f63">Αξία θέσης στον αριθμό 46.283</text>
  <g font-family="Arial" text-anchor="middle"><g font-size="17" font-weight="700" fill="#fff"><rect x="50" y="85" width="160" height="58" fill="#1f4e7b"/><rect x="210" y="85" width="160" height="58" fill="#2878a8"/><rect x="370" y="85" width="160" height="58" fill="#2b8f87"/><rect x="530" y="85" width="160" height="58" fill="#d17a22"/><rect x="690" y="85" width="160" height="58" fill="#b44755"/><text x="130" y="120">Δεκ. χιλιάδων</text><text x="290" y="120">Χιλιάδες</text><text x="450" y="120">Εκατοντάδες</text><text x="610" y="120">Δεκάδες</text><text x="770" y="120">Μονάδες</text></g>
  <g font-size="52" font-weight="700" fill="#172b3a"><rect x="50" y="143" width="800" height="92" fill="#fff" stroke="#adc4d6" stroke-width="2"/><path d="M210 143v92M370 143v92M530 143v92M690 143v92" stroke="#adc4d6" stroke-width="2"/><text x="130" y="207">4</text><text x="290" y="207">6</text><text x="450" y="207">2</text><text x="610" y="207">8</text><text x="770" y="207">3</text></g>
  <g font-size="19" fill="#29475c"><text x="130" y="278">40.000</text><text x="290" y="278">6.000</text><text x="450" y="278">200</text><text x="610" y="278">80</text><text x="770" y="278">3</text><text x="450" y="325" font-size="22" font-weight="700">46.283 = 40.000 + 6.000 + 200 + 80 + 3</text></g></g>
</svg>
