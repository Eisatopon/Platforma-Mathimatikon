<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">Τετραγωνική ρίζα και διαγώνιος τετραγώνου</title>
  <desc id="desc">Τετράγωνο πλευράς α και εμβαδού α τετράγωνο, με διαγώνιο α επί τετραγωνική ρίζα του δύο.</desc>
  <rect width="900" height="460" rx="28" fill="#f5f9ff"/>
  <text x="450" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#173f6b">Ρίζα, εμβαδόν και διαγώνιος</text>
  <rect x="120" y="105" width="260" height="260" rx="6" fill="#dceafb" stroke="#1f4e7b" stroke-width="5"/>
  <line x1="120" y1="365" x2="380" y2="105" stroke="#e36b3d" stroke-width="5"/>
  <text x="250" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#173f6b">πλευρά α</text>
  <text x="404" y="242" font-family="Arial, sans-serif" font-size="24" fill="#173f6b">α</text>
  <text x="240" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f4e7b">E = α²</text>
  <text x="217" y="124" transform="rotate(-45 217 124)" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a34726">d = α√2</text>
  <path d="M505 155h270M505 230h270M505 305h270" stroke="#a9bfd5" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="25" fill="#263b50">
    <text x="520" y="137">Από εμβαδόν σε πλευρά:</text>
    <text x="640" y="195" text-anchor="middle" font-weight="700">α = √E</text>
    <text x="520" y="272">Από πλευρά σε διαγώνιο:</text>
    <text x="640" y="347" text-anchor="middle" font-weight="700">d = α√2</text>
  </g>
</svg>
