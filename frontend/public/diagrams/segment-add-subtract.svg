<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">Πρόσθεση και αφαίρεση ευθύγραμμων τμημάτων</title><desc id="d">Τα συνευθειακά σημεία Α Β Γ με το Β ανάμεσα στα άλλα δείχνουν ότι ΑΓ ίσον ΑΒ συν ΒΓ.</desc><rect width="900" height="330" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Η σειρά των σημείων καθορίζει τη σχέση</text><path d="M120 150H780" stroke="#1f4e7b" stroke-width="7" stroke-linecap="round"/><path d="M120 150H410" stroke="#2a9d8f" stroke-width="11"/><path d="M410 150H780" stroke="#f4a261" stroke-width="11"/><g fill="#e63946"><circle cx="120" cy="150" r="9"/><circle cx="410" cy="150" r="9"/><circle cx="780" cy="150" r="9"/></g><g font-family="Arial" fill="#17324d"><text x="110" y="125" font-size="24">A</text><text x="400" y="125" font-size="24">B</text><text x="770" y="125" font-size="24">Γ</text><text x="265" y="200" text-anchor="middle" font-size="21">AB</text><text x="595" y="200" text-anchor="middle" font-size="21">BΓ</text><text x="450" y="275" text-anchor="middle" font-size="28" font-weight="700">AΓ = AB + BΓ</text></g><path d="M120 225v20h660v-20" fill="none" stroke="#17324d" stroke-width="3"/></svg>
