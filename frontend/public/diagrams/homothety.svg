<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Ομοιοθεσία με κέντρο Κ και λόγο κ=2</title>
<desc id="desc">Τα τρίγωνα ΑΒΓ και Α′Β′Γ′ έχουν αντίστοιχες κορυφές στην ίδια ημιευθεία από το Κ. Κάθε απόσταση και πλευρά διπλασιάζεται.</desc>
<rect width="680" height="430" rx="16" fill="#fff"/>
<g stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"><path d="M65 350 L225 270 M65 350 L545 270 M65 350 L225 30"/></g>
<polygon points="145,310 305,310 145,190" fill="#e0f2fe" stroke="#1f4e7b" stroke-width="3"/>
<polygon points="225,270 545,270 225,30" fill="#ede9fe" fill-opacity=".55" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 4"/>
<g fill="#1f4e7b" font-size="19" font-weight="700"><text x="119" y="330">Α</text><text x="310" y="334">Β</text><text x="120" y="180">Γ</text></g>
<g fill="#7c3aed" font-size="19" font-weight="700"><text x="197" y="290">Α′</text><text x="555" y="276">Β′</text><text x="235" y="47">Γ′</text></g>
<circle cx="65" cy="350" r="6" fill="#b45309"/><text x="40" y="374" font-size="20" font-weight="700" fill="#b45309">Κ</text>
<text x="340" y="405" text-anchor="middle" font-size="19" fill="#334155">κ=2 · μήκη ×2 · περίμετρος ×2 · εμβαδόν ×4</text>
</svg>