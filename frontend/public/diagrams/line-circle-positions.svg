<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">Θέσεις ευθείας και κύκλου</title><desc id="d">Τρεις κύκλοι με εξωτερική, εφαπτομένη και τέμνουσα ευθεία αντιστοιχούν στις σχέσεις d μεγαλύτερο, ίσο και μικρότερο από r.</desc><rect width="960" height="400" rx="24" fill="#f8fafc"/><g font-family="Arial" fill="#17324d"><text x="160" y="42" text-anchor="middle" font-size="22" font-weight="700">Εξωτερική</text><text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700">Εφαπτομένη</text><text x="800" y="42" text-anchor="middle" font-size="22" font-weight="700">Τέμνουσα</text></g><g fill="#eaf4fb" stroke="#1f4e7b" stroke-width="5"><circle cx="160" cy="195" r="90"/><circle cx="480" cy="195" r="90"/><circle cx="800" cy="195" r="90"/></g><g stroke="#e76f51" stroke-width="7" stroke-linecap="round"><path d="M45 315H275"/><path d="M365 285H595"/><path d="M685 220H915"/></g><g stroke="#2a9d8f" stroke-width="4" stroke-dasharray="8 6"><path d="M160 195V315"/><path d="M480 195V285"/><path d="M800 195V220"/></g><circle cx="480" cy="285" r="8" fill="#e63946"/><circle cx="712" cy="220" r="8" fill="#e63946"/><circle cx="888" cy="220" r="8" fill="#e63946"/><g font-family="Arial" fill="#17324d"><text x="160" y="360" text-anchor="middle" font-size="23">d &gt; r · 0 σημεία</text><text x="480" y="360" text-anchor="middle" font-size="23">d = r · 1 σημείο</text><text x="800" y="360" text-anchor="middle" font-size="23">d &lt; r · 2 σημεία</text></g><path d="M320 65V370M640 65V370" stroke="#cbd5e1" stroke-width="2"/></svg>
