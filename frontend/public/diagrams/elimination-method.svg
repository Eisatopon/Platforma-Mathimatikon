<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="t d"><title id="t">Μέθοδος αντίθετων συντελεστών</title><desc id="d">Οι εξισώσεις τρία χ συν δύο ψ ίσον δώδεκα και πέντε χ μείον δύο ψ ίσον τέσσερα προστίθενται, απαλείφεται το ψ και προκύπτει χ ίσον δύο.</desc><rect width="820" height="390" fill="#f8fafc"/><text x="410" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Αντίθετοι συντελεστές</text><g font-family="Arial" font-size="29" text-anchor="middle" fill="#0f172a"><text x="410" y="115">3x + 2y = 12</text><text x="410" y="165">5x − 2y = 4</text><path d="M245 185H575" stroke="#334155" stroke-width="3"/><text x="410" y="230" fill="#2563eb">8x + 0y = 16</text><text x="410" y="290" font-weight="700">x = 2</text><text x="410" y="350" font-size="21" fill="#475569">Το +2y και το −2y αλληλοαναιρούνται.</text></g></svg>
