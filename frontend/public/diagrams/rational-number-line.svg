<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Ευθεία ρητών αριθμών</title><desc id="d">Αριθμογραμμή από το μείον δύο ως το δύο με σημειωμένα τα μείον ενάμισι, μείον ένα δεύτερο και τρία τέταρτα.</desc><rect width="900" height="300" rx="24" fill="#f5f8fb"/><text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Η ευθεία των ρητών</text><path d="M90 155H810" stroke="#29475c" stroke-width="5"/><g stroke="#29475c" stroke-width="3"><path d="M90 135v40M270 135v40M450 130v50M630 135v40M810 135v40"/></g><g font-family="Arial" text-anchor="middle" font-size="20" fill="#29475c"><text x="90" y="210">−2</text><text x="270" y="210">−1</text><text x="450" y="210">0</text><text x="630" y="210">1</text><text x="810" y="210">2</text><circle cx="180" cy="155" r="9" fill="#d17a22"/><text x="180" y="120">−1,5</text><circle cx="360" cy="155" r="9" fill="#2878a8"/><text x="360" y="120">−1/2</text><circle cx="585" cy="155" r="9" fill="#2b8f87"/><text x="585" y="120">3/4</text></g></svg>
