<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Διαίρεση ενός δευτέρου με ένα τέταρτο</title><desc id="d">Μία λωρίδα δείχνει ότι μέσα στο ένα δεύτερο χωρούν δύο τέταρτα.</desc><rect width="900" height="340" rx="24" fill="#f5f8fb"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Πόσα τέταρτα χωρούν σε ένα μισό;</text><g stroke="#fff" stroke-width="4"><rect x="110" y="115" width="170" height="100" fill="#2878a8"/><rect x="280" y="115" width="170" height="100" fill="#2878a8"/><rect x="450" y="115" width="170" height="100" fill="#dce6ec"/><rect x="620" y="115" width="170" height="100" fill="#dce6ec"/></g><path d="M110 95v140M450 95v140" stroke="#173f63" stroke-width="5"/><g font-family="Arial" text-anchor="middle"><text x="195" y="175" font-size="24" font-weight="700" fill="#fff">1/4</text><text x="365" y="175" font-size="24" font-weight="700" fill="#fff">1/4</text><text x="280" y="265" font-size="22" fill="#173f63">1/2 = δύο τέταρτα</text><text x="450" y="310" font-size="27" font-weight="700" fill="#176253">1/2 : 1/4 = 2</text></g></svg>
