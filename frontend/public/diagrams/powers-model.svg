<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Η δύναμη ως επαναλαμβανόμενο γινόμενο</title><desc id="desc">Η δύναμη 3 στην τετάρτη ισούται με τέσσερις παράγοντες 3 και δίνει 81.</desc><rect width="900" height="360" rx="24" fill="#f5f8fb"/><text x="450" y="60" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#173f63">Η δύναμη ως επαναλαμβανόμενο γινόμενο</text>
  <g font-family="Arial" text-anchor="middle"><rect x="65" y="112" width="180" height="130" rx="18" fill="#dcecf8" stroke="#1f4e7b" stroke-width="3"/><text x="145" y="194" font-size="58" font-weight="700" fill="#173f63">3</text><text x="184" y="152" font-size="30" font-weight="700" fill="#b44755">4</text><text x="155" y="275" font-size="20" fill="#29475c">βάση · εκθέτης</text><text x="300" y="190" font-size="42" fill="#536d7d">=</text><g font-size="43" font-weight="700" fill="#176253"><circle cx="380" cy="177" r="47" fill="#dff3ec"/><circle cx="510" cy="177" r="47" fill="#dff3ec"/><circle cx="640" cy="177" r="47" fill="#dff3ec"/><circle cx="770" cy="177" r="47" fill="#dff3ec"/><text x="380" y="192">3</text><text x="510" y="192">3</text><text x="640" y="192">3</text><text x="770" y="192">3</text></g><g font-size="31" fill="#536d7d"><text x="445" y="187">×</text><text x="575" y="187">×</text><text x="705" y="187">×</text></g><text x="575" y="297" font-size="25" font-weight="700" fill="#243b4a">3⁴ = 3 × 3 × 3 × 3 = 81</text></g>
</svg>
