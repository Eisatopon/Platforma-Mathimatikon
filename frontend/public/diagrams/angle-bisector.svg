<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">Μέτρηση γωνίας και διχοτόμος</title><desc id="d">Η γωνία xOy έχει μέτρο 74 μοίρες και η διχοτόμος Oz τη χωρίζει σε δύο ίσες γωνίες 37 μοιρών.</desc><rect width="900" height="380" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Η διχοτόμος χωρίζει τη γωνία σε δύο ίσα μέρη</text><g transform="translate(160 315)" stroke-linecap="round" fill="none"><path d="M0 0H590" stroke="#1f4e7b" stroke-width="7"/><path d="M0 0L160-225" stroke="#1f4e7b" stroke-width="7"/><path d="M0 0L355-200" stroke="#e76f51" stroke-width="6" stroke-dasharray="12 8"/><path d="M95 0A95 95 0 0 0 55-78" stroke="#f4a261" stroke-width="5"/><path d="M55-78A95 95 0 0 0 20-93" stroke="#2a9d8f" stroke-width="5"/></g><circle cx="160" cy="315" r="8" fill="#e63946"/><g font-family="Arial" font-size="22" fill="#17324d"><text x="145" y="350">O</text><text x="755" y="320">x</text><text x="315" y="82">y</text><text x="520" y="105" fill="#e76f51">z — διχοτόμος</text><text x="265" y="265" fill="#2a9d8f">37°</text><text x="330" y="292" fill="#f4a261">37°</text><text x="450" y="345" text-anchor="middle" font-weight="700">74° = 37° + 37°</text></g></svg>
