<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="380" fill="#ffffff"/>
  <g transform="translate(120,190)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#1e293b" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#1e293b"/>
    <circle cx="300" cy="0" r="5" fill="#1e293b"/>
    <text x="0" y="-20" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Α</text>
    <text x="300" y="-20" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Β</text>
    <!-- perpendicular bisector -->
    <line x1="150" y1="-140" x2="150" y2="140" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"/>
    <rect x="150" y="-18" width="18" height="18" fill="none" stroke="#dc2626" stroke-width="2"/>
    <circle cx="150" cy="0" r="4" fill="#dc2626"/>
    <text x="165" y="-150" font-size="16" fill="#dc2626" font-weight="700">μεσοκάθετος του ΑΒ</text>
    <!-- point on bisector equidistant -->
    <circle cx="150" cy="-90" r="5" fill="#10b981"/>
    <text x="165" y="-88" font-size="16" fill="#10b981" font-weight="700">Μ</text>
    <line x1="150" y1="-90" x2="0" y2="0" stroke="#10b981" stroke-width="2"/>
    <line x1="150" y1="-90" x2="300" y2="0" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="320" y="340" font-size="16" fill="#475569" text-anchor="middle">Κάθε σημείο Μ της μεσοκαθέτου ισαπέχει από τα Α και Β</text>
</svg>
