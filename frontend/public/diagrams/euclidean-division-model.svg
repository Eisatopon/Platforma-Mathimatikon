<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Μοντέλο Ευκλείδειας διαίρεσης</title><desc id="desc">Ο αριθμός 23 χωρίζεται σε πέντε πλήρεις ομάδες των 4 και υπόλοιπο 3.</desc><rect width="900" height="360" rx="24" fill="#f5f8fb"/><text x="450" y="53" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#173f63">23 = 4 · 5 + 3</text><g fill="#2878a8" stroke="#fff" stroke-width="2">
  <g id="group"><circle cx="78" cy="135" r="17"/><circle cx="116" cy="135" r="17"/><circle cx="78" cy="178" r="17"/><circle cx="116" cy="178" r="17"/></g><use href="#group" x="140"/><use href="#group" x="280"/><use href="#group" x="420"/><use href="#group" x="560"/></g><g fill="none" stroke="#1f4e7b" stroke-width="3"><rect x="45" y="100" width="105" height="115" rx="14"/><rect x="185" y="100" width="105" height="115" rx="14"/><rect x="325" y="100" width="105" height="115" rx="14"/><rect x="465" y="100" width="105" height="115" rx="14"/><rect x="605" y="100" width="105" height="115" rx="14"/></g><g fill="#d17a22" stroke="#fff" stroke-width="2"><circle cx="765" cy="135" r="17"/><circle cx="803" cy="135" r="17"/><circle cx="841" cy="135" r="17"/></g><g font-family="Arial" text-anchor="middle"><text x="378" y="260" font-size="22" font-weight="700" fill="#173f63">5 πλήρεις ομάδες των 4</text><text x="803" y="260" font-size="22" font-weight="700" fill="#9b4f11">υπόλοιπο 3</text><text x="450" y="318" font-size="23" fill="#29475c">0 ≤ 3 &lt; 4 — το υπόλοιπο είναι μικρότερο από τον διαιρέτη</text></g></svg>
