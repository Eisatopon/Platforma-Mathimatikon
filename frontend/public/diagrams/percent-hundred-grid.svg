<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Πλέγμα εκατοντάδας για το τριάντα πέντε τοις εκατό</title><desc id="d">Σε πλέγμα εκατό ίσων τετραγώνων είναι χρωματισμένα τριάντα πέντε: τρεις πλήρεις σειρές και πέντε ακόμη τετράγωνα.</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-width="2"/></pattern></defs><rect width="900" height="430" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">35 στα 100 ίσα μέρη</text><g transform="translate(110 80)"><rect width="280" height="280" fill="#dce6ec"/><rect width="280" height="84" fill="#2878a8"/><rect y="84" width="140" height="28" fill="#2878a8"/><rect width="280" height="280" fill="url(#grid)" stroke="#1f4e7b" stroke-width="3"/></g><g font-family="Arial" text-anchor="middle"><text x="635" y="175" font-size="42" font-weight="700" fill="#176253">35%</text><text x="635" y="225" font-size="28" fill="#29475c">= 35/100</text><text x="635" y="270" font-size="28" fill="#29475c">= 0,35</text><text x="635" y="330" font-size="20" fill="#536d7d">Η βάση είναι ολόκληρο το πλέγμα.</text></g></svg>
