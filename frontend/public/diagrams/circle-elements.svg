<svg viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="520" fill="#ffffff"/>

  <circle cx="320" cy="260" r="150" fill="none" stroke="#1e293b" stroke-width="2.5"/>

  <!-- center -->
  <circle cx="320" cy="260" r="4" fill="#dc2626"/>
  <text x="333" y="254" font-size="17" fill="#dc2626" font-weight="700">Κ</text>

  <!-- diameter: horizontal through center, label above the line, clear of circle top -->
  <line x1="170" y1="260" x2="470" y2="260" stroke="#10b981" stroke-width="3"/>
  <text x="320" y="242" font-size="17" fill="#10b981" font-weight="700" text-anchor="middle">διάμετρος</text>

  <!-- radius: up-right diagonal, label beside it, clear of circle boundary -->
  <line x1="320" y1="260" x2="383" y2="124" stroke="#6366f1" stroke-width="3"/>
  <text x="392" y="150" font-size="17" fill="#6366f1" font-weight="700">ακτίνα</text>

  <!-- chord: horizontal, both endpoints exactly on the circle, entirely below the diameter (no crossing) -->
  <line x1="443" y1="346" x2="197" y2="346" stroke="#f59e0b" stroke-width="3"/>
  <text x="320" y="372" font-size="17" fill="#f59e0b" font-weight="700" text-anchor="middle">χορδή</text>

  <!-- arc: the minor arc subtended by the chord, along the bottom of the circle -->
  <path d="M 443 346 A 150 150 0 0 1 197 346" fill="none" stroke="#7c3aed" stroke-width="6"/>
  <text x="320" y="435" font-size="17" fill="#7c3aed" font-weight="700" text-anchor="middle">τόξο</text>

  <text x="320" y="495" font-size="17" fill="#475569" text-anchor="middle">Στοιχεία κύκλου: κέντρο, ακτίνα, διάμετρος, χορδή, τόξο</text>
</svg>
