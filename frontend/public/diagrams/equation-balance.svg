<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="t d"><title id="t">Ισορροπία εξίσωσης</title><desc id="d">Ζυγαριά σε ισορροπία που δείχνει ότι η ίδια πράξη εφαρμόζεται και στα δύο μέλη.</desc><rect width="860" height="350" fill="#f8fafc"/><text x="430" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#0f172a">Ίδια πράξη και στα δύο μέλη</text><path d="M430 80V270M320 300H540M230 135H630" stroke="#334155" stroke-width="8"/><path d="M270 135L210 245H330zM590 135L530 245H650z" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><g font-family="Arial" font-size="25" text-anchor="middle" fill="#0f172a"><text x="270" y="225">3x + 6</text><text x="590" y="225">18</text><text x="430" y="335">−6 και στα δύο μέλη ⇒ 3x = 12</text></g></svg>
