<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Επίκεντρη γωνία και αντίστοιχο τόξο</title><desc id="d">Σε κύκλο κέντρου Ο δύο ακτίνες ΟΑ και ΟΒ σχηματίζουν επίκεντρη γωνία 72 μοιρών και επισημαίνουν το αντίστοιχο μικρό τόξο ΑΒ 72 μοιρών.</desc><rect width="900" height="420" rx="24" fill="#f8fafc"/><text x="450" y="46" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Επίκεντρη γωνία ↔ αντίστοιχο τόξο</text><circle cx="430" cy="235" r="145" fill="#eaf4fb" stroke="#1f4e7b" stroke-width="6"/><path d="M430 235L575 235M430 235L475 97" stroke="#1f4e7b" stroke-width="6"/><path d="M575 235A145 145 0 0 0 475 97" fill="none" stroke="#e76f51" stroke-width="12" stroke-linecap="round"/><path d="M500 235A70 70 0 0 0 452 168" fill="none" stroke="#f4a261" stroke-width="6"/><g fill="#e63946"><circle cx="430" cy="235" r="8"/><circle cx="575" cy="235" r="8"/><circle cx="475" cy="97" r="8"/></g><g font-family="Arial" fill="#17324d" font-size="22"><text x="408" y="260">O</text><text x="590" y="242">A</text><text x="475" y="82">B</text><text x="495" y="210" font-weight="700">72°</text><text x="650" y="150" fill="#e76f51">τόξο AB = 72°</text><text x="450" y="397" text-anchor="middle">μέτρο τόξου = μέτρο επίκεντρης γωνίας</text></g></svg>
