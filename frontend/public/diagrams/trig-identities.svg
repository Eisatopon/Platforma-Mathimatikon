<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">Ίδιο ημίτονο και δύο δυνατά συνημίτονα στον μοναδιαίο κύκλο</title>
<desc id="desc">Τα σημεία Μ₁=(4/5,3/5) και Μ₂=(−4/5,3/5) έχουν ίδια τεταγμένη 3/5. Τα συνημίτονα είναι 4/5 και −4/5. Για τα δύο σημεία, το άθροισμα των τετραγώνων των συντεταγμένων είναι 1.</desc>
<rect width="760" height="440" rx="20" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#0f172a">
<text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700">ημω = 3/5 · Ποιο πρόσημο έχει το συνω;</text>
<path d="M480 240A170 170 0 0 0 140 240" fill="none" stroke="#475569" stroke-width="2.5"/>
<path d="M95 240H535m-10-5 10 5-10 5M310 295V55m-5 10 5-10 5 10" fill="none" stroke="#64748b" stroke-width="1.5"/>
<g font-size="17"><text x="544" y="246">x = συνω</text><text x="323" y="60">y</text><text x="321" y="266">Ο</text><text x="140" y="266" text-anchor="middle">−1</text><text x="480" y="266" text-anchor="middle">1</text><text x="321" y="80">1</text></g>
<path d="M110 138H530" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M310 240H446V138Z" fill="#b45309" fill-opacity=".06" stroke="#b45309" stroke-width="2.5"/>
<path d="M310 240H174V138Z" fill="#7c3aed" fill-opacity=".06" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="446" cy="138" r="6" fill="#b45309"/><circle cx="174" cy="138" r="6" fill="#7c3aed"/>
<path d="M437 240v-9h9M183 240v-9h-9" fill="none" stroke="#475569" stroke-width="1.3"/>
<g font-size="19" font-weight="700"><text x="458" y="125" fill="#92400e">Μ₁</text><text x="134" y="125" fill="#6d28d9">Μ₂</text></g>
<g font-size="17"><text x="446" y="287" text-anchor="middle" fill="#92400e">4/5</text><text x="174" y="287" text-anchor="middle" fill="#6d28d9">−4/5</text><text x="544" y="143" fill="#0f766e">y = 3/5</text></g>
<g text-anchor="middle"><text x="380" y="331" font-size="19">Μ₁ = (4/5, 3/5) · Μ₂ = (−4/5, 3/5)</text><text x="380" y="367" font-size="20" font-weight="700">(3/5)² + (±4/5)² = 9/25 + 16/25 = 1</text><text x="380" y="406" font-size="17">Οξεία γωνία: συνω &gt; 0 · Αμβλεία γωνία: συνω &lt; 0</text></g>
</g></svg>
