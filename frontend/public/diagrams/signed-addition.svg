<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="t d"><title id="t">Πρόσθεση ρητών στην αριθμογραμμή</title><desc id="d">Από το μείον δύο μετακινούμαστε πέντε μονάδες δεξιά και φτάνουμε στο τρία.</desc><rect width="900" height="310" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">−2 + 5 = 3</text><path d="M100 180H800" stroke="#29475c" stroke-width="5"/><g stroke="#29475c" stroke-width="2"><path d="M170 165v30M240 165v30M310 165v30M380 165v30M450 160v40M520 165v30M590 165v30M660 165v30M730 165v30"/></g><path d="M310 145Q450 60 590 145" fill="none" stroke="#2b8f87" stroke-width="6"/><path d="M573 132l22 13-22 13" fill="#2b8f87"/><g font-family="Arial" text-anchor="middle" font-size="19"><text x="310" y="230">−2</text><text x="450" y="230">0</text><text x="590" y="230">3</text><text x="450" y="100" fill="#176253">5 μονάδες δεξιά</text></g></svg>
