<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">Θέσεις δύο ευθειών</title><desc id="d">Παράλληλες ευθείες χωρίς κοινό σημείο, πλάγιες τεμνόμενες με ένα κοινό σημείο και κάθετες που σχηματίζουν ορθή γωνία.</desc><rect width="900" height="380" rx="24" fill="#f8fafc"/><g font-family="Arial" fill="#17324d"><text x="150" y="45" text-anchor="middle" font-size="22" font-weight="700">Παράλληλες</text><text x="450" y="45" text-anchor="middle" font-size="22" font-weight="700">Τεμνόμενες</text><text x="750" y="45" text-anchor="middle" font-size="22" font-weight="700">Κάθετες</text></g><g stroke="#1f4e7b" stroke-width="7" fill="none" stroke-linecap="round"><path d="M55 135H245M55 260H245"/><path d="M350 105L550 285M350 285L550 145"/><path d="M650 195H850M750 95V295"/></g><circle cx="450" cy="195" r="8" fill="#e76f51"/><circle cx="750" cy="195" r="8" fill="#e76f51"/><path d="M750 165h30v30" fill="none" stroke="#f4a261" stroke-width="5"/><g font-family="Arial" font-size="20" fill="#17324d"><text x="150" y="325" text-anchor="middle">0 κοινά σημεία</text><text x="450" y="325" text-anchor="middle">1 κοινό σημείο</text><text x="750" y="325" text-anchor="middle">γωνία 90°</text></g><path d="M300 70V340M600 70V340" stroke="#cbd5e1" stroke-width="2"/></svg>
