  <path d="M230 35L455 335" stroke="#0f766e" stroke-width="3"/>
  <path d="M170 115L320 155" stroke="#b45309" stroke-width="3"/>
  <g stroke="#b45309" fill="none" stroke-width="2.5" stroke-linejoin="round">
    <path d="M239 128L249 136L236 139"/>
    <path d="M261.5 278L271.5 286L258.5 289"/>
  </g>
  <g fill="#334155"><circle cx="230" cy="35" r="4"/><circle cx="80" cy="235" r="4"/><circle cx="455" cy="335" r="4"/></g>
  <g fill="#fbbf24" stroke="#92400e" stroke-width="1.5"><circle cx="170" cy="115" r="5"/><circle cx="320" cy="155" r="5"/></g>
  <g font-size="19" font-weight="700" fill="#1e293b">
    <text x="223" y="22">Α</text><text x="54" y="252">Β</text><text x="467" y="349">Γ</text>
    <text x="143" y="114">Δ</text><text x="335" y="152">Ε</text>
