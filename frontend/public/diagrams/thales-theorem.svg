  <g font-size="18" font-weight="700" fill="#0f766e"><text x="289" y="86">6</text><text x="399" y="241">9</text></g>
  <text x="250" y="377" font-size="17" font-weight="700" text-anchor="middle" fill="#92400e">ΔΕ ∥ ΒΓ  ·  ΑΔ/ΔΒ = ΑΕ/ΕΓ = 2/3</text>
  <text x="250" y="403" font-size="15" text-anchor="middle" fill="#475569">Όλα τα μήκη είναι σε cm.</text>
