<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
  <title id="title">Θεώρημα του Θαλή σε τρίγωνο</title>
  <desc id="desc">Τα Δ και Ε βρίσκονται ακριβώς στις πλευρές ΑΒ και ΑΓ. Η ΔΕ είναι παράλληλη στη ΒΓ. ΑΔ=4, ΔΒ=6, ΑΕ=6, ΕΓ=9 cm.</desc>
  <rect width="500" height="420" rx="12" fill="#ffffff"/>
