<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-labelledby="t d"><title id="t">Δειγματικός χώρος δύο ζαριών</title><desc id="d">Πίνακας έξι επί έξι με τα τριάντα έξι διατεταγμένα αποτελέσματα. Επισημαίνονται τα έξι ζεύγη με άθροισμα επτά.</desc><rect width="820" height="560" fill="#f8fafc"/><text x="410" y="38" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">Δύο ζάρια: 36 ισοπίθανα αποτελέσματα</text><g transform="translate(130 80)" font-family="Arial" font-size="17" text-anchor="middle"><g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect width="560" height="420" rx="8"/></g><g stroke="#94a3b8" stroke-width="1"><path d="M80 0V420M160 0V420M240 0V420M320 0V420M400 0V420M480 0V420M0 60H560M0 120H560M0 180H560M0 240H560M0 300H560M0 360H560"/></g><g fill="#fde68a" stroke="#d97706" stroke-width="2"><rect x="480" y="60" width="80" height="60"/><rect x="400" y="120" width="80" height="60"/><rect x="320" y="180" width="80" height="60"/><rect x="240" y="240" width="80" height="60"/><rect x="160" y="300" width="80" height="60"/><rect x="80" y="360" width="80" height="60"/></g><g fill="#0f172a"><text x="40" y="38">ζ₂\ζ₁</text><text x="120" y="38">1</text><text x="200" y="38">2</text><text x="280" y="38">3</text><text x="360" y="38">4</text><text x="440" y="38">5</text><text x="520" y="38">6</text><text x="40" y="98">1</text><text x="40" y="158">2</text><text x="40" y="218">3</text><text x="40" y="278">4</text><text x="40" y="338">5</text><text x="40" y="398">6</text><text x="520" y="98">(6,1)</text><text x="440" y="158">(5,2)</text><text x="360" y="218">(4,3)</text><text x="280" y="278">(3,4)</text><text x="200" y="338">(2,5)</text><text x="120" y="398">(1,6)</text></g></g><text x="410" y="540" text-anchor="middle" font-family="Arial" font-size="21" fill="#92400e">6 αποτελέσματα έχουν άθροισμα 7 ⇒ P = 6/36 = 1/6</text></svg>
