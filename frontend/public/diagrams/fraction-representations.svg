<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Το κλάσμα τρία τέταρτα ως μέρος και ως αριθμός</title><desc id="d">Τρία από τέσσερα ίσα τμήματα είναι χρωματισμένα και το τρία τέταρτα σημειώνεται στην αριθμογραμμή.</desc><rect width="900" height="360" rx="24" fill="#f5f8fb"/><g font-family="Arial"><text x="450" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#173f63">Το ίδιο κλάσμα, δύο αναπαραστάσεις</text><g stroke="#fff" stroke-width="3"><rect x="70" y="105" width="105" height="105" fill="#2878a8"/><rect x="175" y="105" width="105" height="105" fill="#2878a8"/><rect x="280" y="105" width="105" height="105" fill="#2878a8"/><rect x="385" y="105" width="105" height="105" fill="#dce6ec"/></g><text x="280" y="255" text-anchor="middle" font-size="25" font-weight="700" fill="#173f63">3 από 4 ίσα μέρη</text><path d="M575 175H830" stroke="#29475c" stroke-width="4"/><g stroke="#29475c" stroke-width="3"><path d="M575 160v30M639 160v30M703 150v50M767 160v30M830 160v30"/></g><circle cx="767" cy="175" r="11" fill="#d17a22"/><g text-anchor="middle" font-size="20" fill="#29475c"><text x="575" y="225">0</text><text x="639" y="225">1/4</text><text x="703" y="225">1/2</text><text x="767" y="225" font-weight="700" fill="#9b4f11">3/4</text><text x="830" y="225">1</text></g></g></svg>
