<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">Γωνίες ισοσκελούς τριγώνου</title><desc id="d">Ισοσκελές τρίγωνο ΑΒΓ με ίσες πλευρές ΑΒ και ΑΓ, γωνία κορυφής 44 μοίρες και ίσες γωνίες βάσης 68 μοιρών.</desc><rect width="900" height="440" rx="24" fill="#f8fafc"/><text x="450" y="46" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Ισοσκελές τρίγωνο: ίσες πλευρές ↔ ίσες γωνίες βάσης</text><path d="M450 85L170 355H730Z" fill="#eaf4fb" stroke="#1f4e7b" stroke-width="7" stroke-linejoin="round"/><g stroke="#e76f51" stroke-width="5"><path d="M300 219l22 22M578 241l22-22"/></g><g fill="none" stroke="#f4a261" stroke-width="6"><path d="M402 132A68 68 0 0 1 498 132"/><path d="M225 355A55 55 0 0 1 210 316"/><path d="M690 316A55 55 0 0 1 675 355"/></g><g font-family="Arial" fill="#17324d"><text x="450" y="75" text-anchor="middle" font-size="23">A</text><text x="145" y="380" font-size="23">B</text><text x="740" y="380" font-size="23">Γ</text><text x="450" y="157" text-anchor="middle" font-size="22" font-weight="700">44°</text><text x="235" y="335" font-size="22" font-weight="700">68°</text><text x="620" y="335" font-size="22" font-weight="700">68°</text><text x="450" y="412" text-anchor="middle" font-size="24">44° + 68° + 68° = 180°</text></g></svg>
