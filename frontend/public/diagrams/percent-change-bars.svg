<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">Αύξηση και μείωση κατά δέκα τοις εκατό</title><desc id="d">Η αρχική τιμή 200 αυξάνεται κατά δέκα τοις εκατό σε 220 και στη συνέχεια μειώνεται κατά δέκα τοις εκατό σε 198.</desc><rect width="900" height="400" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Ίσα ποσοστά — διαφορετικές βάσεις</text><g font-family="Arial"><text x="90" y="118" font-size="20" fill="#29475c">Αρχική</text><rect x="210" y="85" width="400" height="52" rx="8" fill="#2878a8"/><text x="620" y="119" font-size="23" font-weight="700" fill="#173f63">200 €</text><text x="90" y="208" font-size="20" fill="#29475c">+10%</text><rect x="210" y="175" width="440" height="52" rx="8" fill="#2b8f87"/><text x="660" y="209" font-size="23" font-weight="700" fill="#176253">220 €</text><text x="90" y="298" font-size="20" fill="#29475c">−10%</text><rect x="210" y="265" width="396" height="52" rx="8" fill="#d17a22"/><text x="616" y="299" font-size="23" font-weight="700" fill="#9b4f11">198 €</text><text x="450" y="365" text-anchor="middle" font-size="22" font-weight="700" fill="#b44755">200 · 1,10 · 0,90 = 198 → συνολική μείωση 1%</text></g></svg>
