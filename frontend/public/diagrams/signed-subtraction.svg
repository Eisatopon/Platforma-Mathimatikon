<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="t d"><title id="t">Αφαίρεση αρνητικού στην αριθμογραμμή</title><desc id="d">Από το μείον τέσσερα, η αφαίρεση του μείον εννέα γίνεται πρόσθεση εννέα και καταλήγει στο πέντε.</desc><rect width="900" height="310" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">−4 − (−9) = −4 + 9 = 5</text><path d="M100 180H800" stroke="#29475c" stroke-width="5"/><path d="M210 145Q450 45 690 145" fill="none" stroke="#d17a22" stroke-width="6"/><path d="M673 132l22 13-22 13" fill="#d17a22"/><g font-family="Arial" text-anchor="middle" font-size="20"><text x="210" y="225">−4</text><text x="450" y="225">0</text><text x="690" y="225">5</text><text x="450" y="95" fill="#9b4f11">αφαιρώ αρνητικό → κινούμαι δεξιά</text></g></svg>
