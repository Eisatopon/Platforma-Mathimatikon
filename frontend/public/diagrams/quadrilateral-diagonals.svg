<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="t d"><title id="t">Ιδιότητες διαγωνίων τετραπλεύρων</title><desc id="d">Παραλληλόγραμμο, ορθογώνιο, ρόμβος και τετράγωνο με τις διαγωνίους τους και συνοπτικές ιδιότητες.</desc><rect width="1000" height="460" rx="24" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Οι διαγώνιοι αποκαλύπτουν το είδος του παραλληλογράμμου</text><g font-family="Arial" fill="#17324d" text-anchor="middle" font-size="21" font-weight="700"><text x="135" y="82">Παραλληλόγραμμο</text><text x="380" y="82">Ορθογώνιο</text><text x="625" y="82">Ρόμβος</text><text x="865" y="82">Τετράγωνο</text></g><g fill="#eaf4fb" stroke="#1f4e7b" stroke-width="5"><path d="M35 285L75 120h180l-40 165z"/><rect x="290" y="120" width="180" height="165"/><path d="M625 105L735 202L625 300L515 202Z"/><rect x="785" y="115" width="165" height="165"/></g><g stroke="#e76f51" stroke-width="4" fill="none"><path d="M35 285L255 120M75 120L215 285"/><path d="M290 120L470 285M470 120L290 285"/><path d="M625 105V300M515 202H735"/><path d="M785 115L950 280M950 115L785 280"/></g><g fill="#e63946"><circle cx="145" cy="202.5" r="7"/><circle cx="380" cy="202.5" r="7"/><circle cx="625" cy="202" r="7"/><circle cx="867.5" cy="197.5" r="7"/></g><path d="M625 182h20v20M867 177h20v20" fill="none" stroke="#2a9d8f" stroke-width="4"/><g font-family="Arial" fill="#17324d" text-anchor="middle" font-size="19"><text x="145" y="335">διχοτομούνται</text><text x="380" y="335">διχοτομούνται</text><text x="380" y="362">και είναι ίσες</text><text x="625" y="335">διχοτομούνται</text><text x="625" y="362">και είναι κάθετες</text><text x="867" y="328">διχοτομούνται,</text><text x="867" y="355">είναι ίσες</text><text x="867" y="382">και κάθετες</text></g><path d="M270 70V410M495 70V410M755 70V410" stroke="#cbd5e1" stroke-width="2"/></svg>
