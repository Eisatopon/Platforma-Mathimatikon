<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="320" fill="#ffffff"/>

  <!-- Case 1: parallel -->
  <g transform="translate(20,20)">
    <polygon points="10,180 150,180 180,100 40,100" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <line x1="0" y1="70" x2="190" y2="70" stroke="#10b981" stroke-width="3"/>
    <text x="95" y="205" font-size="13" fill="#6366f1" font-weight="700" text-anchor="middle">επίπεδο</text>
    <text x="95" y="55" font-size="13" fill="#10b981" font-weight="700" text-anchor="middle">παράλληλη ευθεία</text>
  </g>

  <!-- Case 2: intersecting -->
  <g transform="translate(240,20)">
    <polygon points="10,180 150,180 180,100 40,100" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <line x1="95" y1="40" x2="95" y2="230" stroke="#dc2626" stroke-width="3"/>
    <circle cx="95" cy="148" r="4" fill="#dc2626"/>
    <text x="95" y="205" font-size="13" fill="#6366f1" font-weight="700" text-anchor="middle">επίπεδο</text>
    <text x="95" y="30" font-size="13" fill="#dc2626" font-weight="700" text-anchor="middle">τέμνουσα ευθεία</text>
  </g>

  <!-- Case 3: lies within plane -->
  <g transform="translate(460,20)">
    <polygon points="10,180 150,180 180,100 40,100" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <line x1="15" y1="160" x2="165" y2="160" stroke="#f59e0b" stroke-width="3"/>
    <text x="95" y="205" font-size="13" fill="#6366f1" font-weight="700" text-anchor="middle">επίπεδο</text>
    <text x="95" y="145" font-size="13" fill="#f59e0b" font-weight="700" text-anchor="middle">ανήκει στο επίπεδο</text>
  </g>

  <text x="320" y="290" font-size="14" fill="#475569" text-anchor="middle">Ευθεία ως προς επίπεδο: παράλληλη, τέμνουσα, ή ανήκει σε αυτό</text>
</svg>
