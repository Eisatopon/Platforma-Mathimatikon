<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Κλίμακα ακέραιων εκθετών του δύο</title><desc id="d">Οι δυνάμεις του δύο από τον εκθέτη τρία ως τον μείον τρία διαιρούνται δια δύο σε κάθε βήμα.</desc><rect width="900" height="340" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Κάθε βήμα προς τα δεξιά: ÷2</text><g font-family="Arial" text-anchor="middle" font-size="21" font-weight="700"><g fill="#dcecf8" stroke="#2878a8" stroke-width="2"><rect x="65" y="115" width="110" height="100"/><rect x="175" y="115" width="110" height="100"/><rect x="285" y="115" width="110" height="100"/><rect x="395" y="115" width="110" height="100"/><rect x="505" y="115" width="110" height="100"/><rect x="615" y="115" width="110" height="100"/><rect x="725" y="115" width="110" height="100"/></g><text x="120" y="153">2³</text><text x="120" y="195">8</text><text x="230" y="153">2²</text><text x="230" y="195">4</text><text x="340" y="153">2¹</text><text x="340" y="195">2</text><text x="450" y="153">2⁰</text><text x="450" y="195">1</text><text x="560" y="153">2⁻¹</text><text x="560" y="195">1/2</text><text x="670" y="153">2⁻²</text><text x="670" y="195">1/4</text><text x="780" y="153">2⁻³</text><text x="780" y="195">1/8</text><text x="450" y="285" font-size="20" fill="#29475c">2⁻ⁿ = 1 / 2ⁿ</text></g></svg>
