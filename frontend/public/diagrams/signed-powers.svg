<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Δυνάμεις αρνητικής βάσης</title><desc id="d">Άρτιος εκθέτης σε αρνητική βάση δίνει θετικό αποτέλεσμα και περιττός αρνητικό.</desc><rect width="900" height="340" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Η παρατικότητα του εκθέτη καθορίζει το πρόσημο</text><g font-family="Arial" text-anchor="middle"><rect x="80" y="95" width="330" height="170" rx="18" fill="#dff3ec" stroke="#2b8f87" stroke-width="3"/><text x="245" y="150" font-size="28" fill="#176253">άρτιος εκθέτης</text><text x="245" y="215" font-size="38" font-weight="700" fill="#176253">(−2)⁴ = 16</text><rect x="490" y="95" width="330" height="170" rx="18" fill="#fde5e8" stroke="#b44755" stroke-width="3"/><text x="655" y="150" font-size="28" fill="#9d3341">περιττός εκθέτης</text><text x="655" y="215" font-size="38" font-weight="700" fill="#9d3341">(−2)³ = −8</text><text x="450" y="312" font-size="20" fill="#29475c">Οι παρενθέσεις δείχνουν ότι το αρνητικό ανήκει στη βάση.</text></g></svg>
