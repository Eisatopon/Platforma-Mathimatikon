<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Όγκος πρίσματος και κυλίνδρου</title>
  <desc id="desc">Ένα ορθό πρίσμα και ένας κύλινδρος με χρωματισμένες βάσεις και σημειωμένο ύψος, για τον κοινό τύπο όγκου εμβαδόν βάσης επί ύψος.</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <style>
      .edge{fill:none;stroke:#1f4e7b;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
      .dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6}
      .measure{fill:none;stroke:#dc2626;stroke-width:2.5;stroke-linecap:round}
      .label{font:600 18px Arial,sans-serif;fill:#163a5c}
      .formula{font:700 22px Arial,sans-serif;fill:#1f4e7b}
      .small{font:600 16px Arial,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="720" height="360" rx="24" fill="#f8fafc"/>

  <g transform="translate(45 42)">
    <polygon points="45,62 190,62 235,28 90,28" fill="url(#face)"/>
    <polygon points="45,62 190,62 190,245 45,245" fill="url(#side)"/>
    <polygon points="190,62 235,28 235,211 190,245" fill="#dbeafe" opacity=".72"/>
    <path class="edge" d="M45 62h145l45-34H90zM45 62v183h145l45-34V28M190 62v183"/>
    <path class="dash" d="M45 245l45-34h145M90 28v183"/>
    <path class="measure" d="M28 62v183m-7-183h14m-14 183h14"/>
    <text class="label" x="111" y="276">Πρίσμα</text>
    <text class="small" x="6" y="160">υ</text>
    <text class="small" x="116" y="52">Ε<tspan baseline-shift="sub" font-size="12">β</tspan></text>
  </g>

  <g transform="translate(390 42)">
    <path d="M35 64C35 42 80 25 135 25s100 17 100 39v180c0 22-45 39-100 39S35 266 35 244z" fill="url(#side)"/>
    <ellipse cx="135" cy="64" rx="100" ry="39" fill="url(#face)"/>
    <path class="edge" d="M35 64v180c0 22 45 39 100 39s100-17 100-39V64M35 64c0 22 45 39 100 39s100-17 100-39-45-39-100-39S35 42 35 64z"/>
    <path class="dash" d="M35 244c0-22 45-39 100-39s100 17 100 39"/>
    <path class="measure" d="M258 64v180m-7-180h14m-14 180h14"/>
    <path class="measure" d="M135 64h82"/>
    <text class="small" x="267" y="160">υ</text>
    <text class="small" x="173" y="54">r</text>
    <text class="label" x="96" y="315">Κύλινδρος</text>
  </g>

  <text class="formula" x="360" y="338" text-anchor="middle">V = Εβ · υ</text>
</svg>
