<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Κύκλος επίλυσης προβλήματος με εξίσωση</title><desc id="d">Τέσσερα στάδια συνδέονται κυκλικά: κατανοώ, μοντελοποιώ, λύνω και ελέγχω.</desc><rect width="900" height="430" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Από το πρόβλημα στην τεκμηριωμένη απάντηση</text><g font-family="Arial" text-anchor="middle" font-weight="700"><rect x="335" y="78" width="230" height="65" rx="18" fill="#1f4e7b"/><text x="450" y="119" font-size="22" fill="#fff">1. Κατανοώ</text><rect x="610" y="185" width="230" height="65" rx="18" fill="#2878a8"/><text x="725" y="226" font-size="22" fill="#fff">2. Μοντελοποιώ</text><rect x="335" y="292" width="230" height="65" rx="18" fill="#2b8f87"/><text x="450" y="333" font-size="22" fill="#fff">3. Λύνω</text><rect x="60" y="185" width="230" height="65" rx="18" fill="#d17a22"/><text x="175" y="226" font-size="22" fill="#fff">4. Ελέγχω</text><g fill="none" stroke="#7895a8" stroke-width="5"><path d="M565 120Q690 125 715 170M720 250Q690 290 575 320M325 325Q205 300 180 265M175 180Q205 130 325 115"/></g><text x="450" y="210" font-size="21" fill="#29475c">δεδομένα → εξίσωση</text><text x="450" y="240" font-size="21" fill="#29475c">→ λύση → ερμηνεία</text><text x="450" y="400" font-size="19" font-weight="400" fill="#536d7d">Αν ο έλεγχος αποτύχει, επιστρέφουμε στην κατανόηση και στο μοντέλο.</text></g></svg>
