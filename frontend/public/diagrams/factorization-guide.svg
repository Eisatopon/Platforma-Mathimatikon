<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="t d"><title id="t">Οδηγός επιλογής παραγοντοποίησης</title><desc id="d">Διαδοχικός έλεγχος κοινού παράγοντα, αξιοσημείωτης ταυτότητας και ομαδοποίησης, με τελικό έλεγχο μέσω ανάπτυξης.</desc><rect width="900" height="390" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="450" y="42" font-size="27" font-weight="700" fill="#0f172a">Παραγοντοποίηση: σειρά ελέγχου</text><g font-size="21"><rect x="55" y="105" width="220" height="90" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="165" y="143">1. Κοινός</text><text x="165" y="172">παράγοντας;</text><rect x="340" y="105" width="220" height="90" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="450" y="143">2. Αξιοσημείωτη</text><text x="450" y="172">ταυτότητα;</text><rect x="625" y="105" width="220" height="90" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="735" y="143">3. Ομαδοποίηση</text><text x="735" y="172">όρων;</text><path d="M275 150H332M560 150H617" stroke="#475569" stroke-width="4"/><path d="M332 150l-12-8v16zM617 150l-12-8v16z" fill="#475569"/><rect x="285" y="270" width="330" height="75" rx="15" fill="#fce7f3" stroke="#db2777" stroke-width="3"/><text x="450" y="317">Έλεγχος με ανάπτυξη</text><path d="M735 198Q735 307 625 307" fill="none" stroke="#475569" stroke-width="4"/></g></g></svg>
