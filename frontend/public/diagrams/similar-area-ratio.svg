<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Λόγος μηκών 2, λόγος εμβαδών 4</title>
<desc id="desc">Σε κοινή κλίμακα, τετράγωνο πλευράς 2 cm έχει 4 μοναδιαία τετραγωνάκια και τετράγωνο πλευράς 4 cm έχει 16. Κάθε τετραγωνάκι έχει εμβαδόν 1 cm².</desc>
<rect width="660" height="350" rx="16" fill="#fff"/>
<text x="330" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">Δύο διαστάσεις ×2 → εμβαδόν ×4</text>
<rect x="70" y="170" width="80" height="80" fill="#e0f2fe" stroke="#1f4e7b" stroke-width="3"/>
<g stroke="#1f4e7b" stroke-width="1"><path d="M110 170V250 M70 210H150"/></g>
<rect x="350" y="90" width="160" height="160" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
<g stroke="#0f766e" stroke-width="1"><path d="M390 90V250 M430 90V250 M470 90V250 M350 130H510 M350 170H510 M350 210H510"/></g>
<g font-size="18" font-weight="700"><g fill="#1f4e7b"><text x="110" y="155" text-anchor="middle">2 cm</text><text x="110" y="285" text-anchor="middle">Ε₁ = 4 cm²</text></g><g fill="#0f766e"><text x="430" y="75" text-anchor="middle">4 cm</text><text x="430" y="285" text-anchor="middle">Ε₂ = 16 cm²</text></g></g>
<text x="330" y="328" text-anchor="middle" font-size="18" fill="#334155">κ = 4/2 = 2 · Ε₂/Ε₁ = 16/4 = 4 = κ²</text>
</svg>
