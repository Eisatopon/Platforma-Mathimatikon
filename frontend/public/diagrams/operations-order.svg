<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Σειρά εκτέλεσης αριθμητικών πράξεων</title><desc id="desc">Τρία διαδοχικά βήματα: παρενθέσεις, πολλαπλασιασμοί και διαιρέσεις, προσθέσεις και αφαιρέσεις.</desc>
  <rect width="900" height="360" rx="24" fill="#f5f8fb"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#173f63">Σειρά εκτέλεσης πράξεων</text>
  <g font-family="Arial" text-anchor="middle"><rect x="55" y="110" width="220" height="130" rx="18" fill="#dcecf8" stroke="#1f4e7b" stroke-width="3"/><rect x="340" y="110" width="220" height="130" rx="18" fill="#dff3ec" stroke="#24806f" stroke-width="3"/><rect x="625" y="110" width="220" height="130" rx="18" fill="#fff0d8" stroke="#c46b18" stroke-width="3"/><text x="165" y="155" font-size="20" fill="#29475c">1ο βήμα</text><text x="165" y="205" font-size="26" font-weight="700" fill="#173f63">Παρενθέσεις</text><text x="450" y="155" font-size="20" fill="#29475c">2ο βήμα</text><text x="450" y="195" font-size="23" font-weight="700" fill="#176253">Πολλαπλασιασμοί</text><text x="450" y="224" font-size="20" fill="#176253">και διαιρέσεις</text><text x="735" y="155" font-size="20" fill="#29475c">3ο βήμα</text><text x="735" y="195" font-size="23" font-weight="700" fill="#9b4f11">Προσθέσεις</text><text x="735" y="224" font-size="20" fill="#9b4f11">και αφαιρέσεις</text><path d="M280 175h45M565 175h45" stroke="#627d90" stroke-width="5" marker-end="url(#a)"/><text x="450" y="305" font-size="24" font-weight="700" fill="#243b4a">12 + 3 × 4 = 12 + 12 = 24</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#627d90"/></marker></defs>
</svg>
