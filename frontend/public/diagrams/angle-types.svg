<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="680" height="340" fill="#ffffff"/>
  <!-- Acute angle -->
  <g>
    <line x1="60" y1="120" x2="200" y2="120" stroke="#1e293b" stroke-width="3"/>
    <line x1="60" y1="120" x2="170" y2="45" stroke="#1e293b" stroke-width="3"/>
    <path d="M 100 120 A 40 40 0 0 0 90 92" fill="none" stroke="#6366f1" stroke-width="2.5"/>
    <text x="115" y="100" font-size="15" fill="#6366f1" font-weight="700">30°</text>
    <text x="130" y="160" font-size="16" fill="#475569" text-anchor="middle">Οξεία (&lt;90°)</text>
  </g>
  <!-- Right angle -->
  <g transform="translate(220,0)">
    <line x1="60" y1="120" x2="200" y2="120" stroke="#1e293b" stroke-width="3"/>
    <line x1="60" y1="120" x2="60" y2="30" stroke="#1e293b" stroke-width="3"/>
    <rect x="60" y="100" width="20" height="20" fill="none" stroke="#10b981" stroke-width="2.5"/>
    <text x="130" y="160" font-size="16" fill="#475569" text-anchor="middle">Ορθή (=90°)</text>
  </g>
  <!-- Obtuse angle -->
  <g transform="translate(440,0)">
    <line x1="60" y1="120" x2="200" y2="120" stroke="#1e293b" stroke-width="3"/>
    <line x1="60" y1="120" x2="30" y2="30" stroke="#1e293b" stroke-width="3"/>
    <path d="M 110 120 A 50 50 0 0 0 78 76" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="128" y="90" font-size="15" fill="#f59e0b" font-weight="700">130°</text>
    <text x="115" y="160" font-size="16" fill="#475569" text-anchor="middle">Αμβλεία (&gt;90°)</text>
  </g>
  <!-- Straight angle -->
  <g transform="translate(0,190)">
    <line x1="40" y1="60" x2="280" y2="60" stroke="#1e293b" stroke-width="3"/>
    <circle cx="160" cy="60" r="4" fill="#dc2626"/>
    <path d="M 220 60 A 60 60 0 0 0 100 60" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <text x="160" y="105" font-size="16" fill="#475569" text-anchor="middle">Ευθεία γωνία (=180°)</text>
  </g>
  <!-- Full angle -->
  <g transform="translate(360,190)">
    <line x1="140" y1="60" x2="270" y2="60" stroke="#1e293b" stroke-width="3"/>
    <circle cx="140" cy="60" r="4" fill="#7c3aed"/>
    <circle cx="140" cy="60" r="45" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="180" y="105" font-size="16" fill="#475569" text-anchor="middle">Πλήρης γωνία (=360°)</text>
  </g>
</svg>
