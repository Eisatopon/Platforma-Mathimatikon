<svg viewBox="0 0 620 350" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="620" height="350" fill="#ffffff"/>

  <!-- Triangle 1 -->
  <g transform="translate(60,40)">
    <polygon points="0,220 180,220 90,20" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
    <text x="-15" y="230" font-size="15" fill="#1e293b" font-weight="700">Α</text>
    <text x="185" y="230" font-size="15" fill="#1e293b" font-weight="700">Β</text>
    <text x="85" y="12" font-size="15" fill="#1e293b" font-weight="700">Γ</text>
    <!-- tick marks on sides: single tick AB, double tick BC, triple tick AC -->
    <line x1="80" y1="222" x2="100" y2="222" stroke="#dc2626" stroke-width="2"/>
    <line x1="135" y1="128" x2="147" y2="120" stroke="#10b981" stroke-width="2"/>
    <line x1="140" y1="138" x2="152" y2="130" stroke="#10b981" stroke-width="2"/>
    <line x1="38" y1="128" x2="50" y2="120" stroke="#f59e0b" stroke-width="2"/>
    <text x="70" y="280" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Τρίγωνο ΑΒΓ</text>
  </g>

  <!-- Triangle 2 (congruent, rotated/reflected slightly differently positioned) -->
  <g transform="translate(360,40)">
    <polygon points="20,20 200,20 110,220" fill="#dcfce7" stroke="#10b981" stroke-width="2.5"/>
    <text x="0" y="15" font-size="15" fill="#1e293b" font-weight="700">Δ</text>
    <text x="205" y="15" font-size="15" fill="#1e293b" font-weight="700">Ε</text>
    <text x="105" y="240" font-size="15" fill="#1e293b" font-weight="700">Ζ</text>
    <line x1="100" y1="18" x2="120" y2="18" stroke="#dc2626" stroke-width="2"/>
    <line x1="155" y1="112" x2="167" y2="120" stroke="#f59e0b" stroke-width="2"/>
    <line x1="160" y1="122" x2="172" y2="130" stroke="#f59e0b" stroke-width="2"/>
    <line x1="58" y1="112" x2="70" y2="120" stroke="#10b981" stroke-width="2"/>
    <line x1="63" y1="122" x2="75" y2="130" stroke="#10b981" stroke-width="2"/>
    <text x="110" y="280" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Τρίγωνο ΔΕΖ</text>
  </g>

  <text x="310" y="335" font-size="14" fill="#475569" text-anchor="middle">Ίσα τρίγωνα: ίδιο πλήθος γραμμών σε αντίστοιχες πλευρές = ίσο μήκος</text>
</svg>