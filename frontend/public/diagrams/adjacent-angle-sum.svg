<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="t d"><title id="t">Άθροισμα διαδοχικών γωνιών</title><desc id="d">Τρεις ημιευθείες χωρίζουν μία συνολική γωνία σε διαδοχικές γωνίες 35 και 48 μοιρών με άθροισμα 83 μοίρες.</desc><rect width="900" height="370" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Διαδοχικές γωνίες: προσθέτουμε τα μέτρα</text><g transform="translate(180 315)" fill="none" stroke-linecap="round"><path d="M0 0H590" stroke="#1f4e7b" stroke-width="7"/><path d="M0 0L165-235" stroke="#1f4e7b" stroke-width="7"/><path d="M0 0L420-175" stroke="#e76f51" stroke-width="6"/><path d="M105 0A105 105 0 0 0 97-40" stroke="#f4a261" stroke-width="6"/><path d="M97-40A105 105 0 0 0 60-86" stroke="#2a9d8f" stroke-width="6"/></g><circle cx="180" cy="315" r="8" fill="#e63946"/><g font-family="Arial" fill="#17324d"><text x="300" y="285" font-size="22">35°</text><text x="285" y="215" font-size="22">48°</text><text x="450" y="345" text-anchor="middle" font-size="27" font-weight="700">35° + 48° = 83°</text></g></svg>
