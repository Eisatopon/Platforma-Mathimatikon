<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="t d"><title id="t">Εμβαδικό μοντέλο πολλαπλασιασμού κλασμάτων</title><desc id="d">Ορθογώνιο χωρισμένο σε δώδεκα μέρη δείχνει ότι τα δύο τρίτα των τριών τετάρτων είναι έξι δωδέκατα ή ένα δεύτερο.</desc><rect width="900" height="410" rx="24" fill="#f5f8fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#173f63">Μέρος ενός μέρους</text><g transform="translate(200 85)" stroke="#fff" stroke-width="3"><rect width="500" height="240" fill="#dce6ec"/><rect width="375" height="240" fill="#b9d9ee"/><rect width="375" height="160" fill="#2b8f87"/><path d="M125 0v240M250 0v240M375 0v240M0 80h500M0 160h500" fill="none" stroke="#fff"/></g><g font-family="Arial"><text x="712" y="215" font-size="20" fill="#176253">2/3</text><text x="385" y="352" font-size="20" fill="#2878a8">3/4</text><text x="450" y="390" text-anchor="middle" font-size="25" font-weight="700" fill="#173f63">2/3 · 3/4 = 6/12 = 1/2</text></g></svg>
