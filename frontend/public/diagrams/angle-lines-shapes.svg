<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Γωνία, είδη γραμμών και ίσα σχήματα</title><desc id="d">Τρεις ενότητες δείχνουν μία γωνία xOy, ευθεία τεθλασμένη και καμπύλη γραμμή, και δύο ίσα τρίγωνα που συμπίπτουν.</desc><rect width="900" height="360" rx="24" fill="#f8fafc"/><g font-family="Arial" fill="#17324d"><text x="150" y="40" text-anchor="middle" font-size="22" font-weight="700">Γωνία</text><text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700">Γραμμές</text><text x="750" y="40" text-anchor="middle" font-size="22" font-weight="700">Ίσα σχήματα</text></g><g stroke="#1f4e7b" stroke-width="6" fill="none" stroke-linecap="round"><path d="M145 245L75 95M145 245L255 125"/><path d="M340 105H560"/><path d="M340 180l55-35 55 45 55-40 55 30"/><path d="M340 260c45-70 95 70 140 0s60-30 80-5"/><path d="M655 260L725 100l85 160z"/><path d="M680 260L750 100l85 160z" stroke="#e76f51" opacity=".6"/></g><path d="M112 172A78 78 0 0 1 198 184" fill="none" stroke="#f4a261" stroke-width="5"/><circle cx="145" cy="245" r="7" fill="#e76f51"/><g font-family="Arial" font-size="20" fill="#17324d"><text x="134" y="280">O</text><text x="60" y="90">x</text><text x="260" y="125">y</text><text x="350" y="95">ευθεία</text><text x="350" y="170">τεθλασμένη</text><text x="350" y="245">καμπύλη</text><text x="730" y="300" text-anchor="middle">ακριβής σύμπτωση</text></g><path d="M300 60V320M600 60V320" stroke="#cbd5e1" stroke-width="2"/></svg>
