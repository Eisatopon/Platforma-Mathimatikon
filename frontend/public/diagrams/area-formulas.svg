<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>

  <!-- Triangle -->
  <g transform="translate(20,20)">
    <polygon points="90,10 20,150 160,150" fill="#dbeafe" stroke="#6366f1" stroke-width="2.5"/>
    <line x1="90" y1="10" x2="90" y2="150" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="98" y="85" font-size="14" fill="#dc2626" font-weight="700">ύψος υ</text>
    <line x1="20" y1="160" x2="160" y2="160" stroke="#10b981" stroke-width="3"/>
    <text x="90" y="180" font-size="14" fill="#10b981" font-weight="700" text-anchor="middle">βάση β</text>
    <text x="90" y="215" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Τρίγωνο</text>
    <text x="90" y="235" font-size="14" fill="#475569" text-anchor="middle">E = β·υ/2</text>
  </g>

  <!-- Parallelogram -->
  <g transform="translate(250,20)">
    <polygon points="40,10 170,10 130,150 0,150" fill="#dcfce7" stroke="#10b981" stroke-width="2.5"/>
    <line x1="40" y1="10" x2="40" y2="150" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="48" y="85" font-size="14" fill="#dc2626" font-weight="700">ύψος υ</text>
    <line x1="0" y1="160" x2="130" y2="160" stroke="#6366f1" stroke-width="3"/>
    <text x="65" y="180" font-size="14" fill="#6366f1" font-weight="700" text-anchor="middle">βάση β</text>
    <text x="85" y="215" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Παραλληλόγραμμο</text>
    <text x="85" y="235" font-size="14" fill="#475569" text-anchor="middle">E = β·υ</text>
  </g>

  <!-- Trapezoid -->
  <g transform="translate(480,20)">
    <polygon points="50,10 130,10 170,150 10,150" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="50" y1="10" x2="50" y2="150" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="58" y="85" font-size="14" fill="#dc2626" font-weight="700">υ</text>
    <line x1="50" y1="10" x2="130" y2="10" stroke="#6366f1" stroke-width="3"/>
    <text x="90" y="0" font-size="13" fill="#6366f1" font-weight="700" text-anchor="middle">β</text>
    <line x1="10" y1="160" x2="170" y2="160" stroke="#10b981" stroke-width="3"/>
    <text x="90" y="180" font-size="13" fill="#10b981" font-weight="700" text-anchor="middle">B</text>
    <text x="90" y="215" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Τραπέζιο</text>
    <text x="90" y="235" font-size="14" fill="#475569" text-anchor="middle">E = (β+B)·υ/2</text>
  </g>
</svg>
