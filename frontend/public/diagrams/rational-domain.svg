<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Απλοποίηση ρητής παράστασης με περιορισμό</title><desc id="d">Η παράσταση χ τετράγωνο μείον εννέα προς χ μείον τρία απλοποιείται σε χ συν τρία, αλλά η τιμή χ ίσον τρία παραμένει αποκλεισμένη.</desc><rect width="900" height="360" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="450" y="45" font-size="27" font-weight="700" fill="#0f172a">Πρώτα οι περιορισμοί — μετά η απλοποίηση</text><rect x="70" y="95" width="250" height="155" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="195" y="143" font-size="22">Παρονομαστής: x−3</text><text x="195" y="185" font-size="25" font-weight="700">x ≠ 3</text><text x="195" y="224" font-size="18">γράφεται πριν από κάθε διαγραφή</text><rect x="390" y="95" width="440" height="155" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="610" y="150" font-size="25">(x²−9)/(x−3)</text><text x="610" y="195" font-size="25">= (x−3)(x+3)/(x−3)</text><text x="610" y="235" font-size="25" font-weight="700">= x+3, με x ≠ 3</text><text x="450" y="320" font-size="20" fill="#475569">Η απλοποιημένη μορφή δεν επαναφέρει την απαγορευμένη τιμή.</text></g></svg>
