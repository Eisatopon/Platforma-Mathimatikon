<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1899 518" role="img" aria-labelledby="title description">
  <title id="title">MathTopon</title>
  <desc id="description">Ο τόπος των Μαθηματικών</desc>

  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a548e"/>
      <stop offset="1" stop-color="#003766"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f41418"/>
      <stop offset="1" stop-color="#dc0007"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8efbd"/>
      <stop offset="1" stop-color="#9fd697"/>
    </linearGradient>
  </defs>

  <!-- Mathematical emblem -->
  <circle cx="255" cy="258" r="239" fill="none" stroke="url(#navy)" stroke-width="26"/>

  <!-- Soft green sector inside the compass construction -->
  <path d="M76 407 C155 334 250 270 350 244 L444 407 Z" fill="url(#green)"/>

  <!-- Compass and triangle construction -->
  <path d="M260 37 L76 407" fill="none" stroke="url(#navy)" stroke-width="28" stroke-linecap="round"/>
  <path d="M260 37 L444 407" fill="none" stroke="url(#navy)" stroke-width="28" stroke-linecap="round"/>
  <path d="M76 407 C156 333 250 270 350 244" fill="none" stroke="url(#navy)" stroke-width="28" stroke-linecap="round"/>
  <path d="M76 407 H444" fill="none" stroke="url(#navy)" stroke-width="28" stroke-linecap="round"/>

  <!-- Three construction points with white isolation rings -->
  <circle cx="260" cy="34" r="39" fill="url(#red)" stroke="#fff" stroke-width="15"/>
  <circle cx="75" cy="407" r="39" fill="url(#red)" stroke="#fff" stroke-width="15"/>
  <circle cx="444" cy="407" r="39" fill="url(#red)" stroke="#fff" stroke-width="15"/>

  <!-- Divider -->
  <rect x="534" y="67" width="11" height="363" rx="5.5" fill="#8ec8ee"/>

  <!-- Wordmark. textLength keeps the approved proportions consistent on every device. -->
  <text x="590" y="255"
        fill="url(#navy)"
        font-family="Arial, Helvetica, sans-serif"
        font-size="249"
        font-weight="900"
        letter-spacing="-9"
        textLength="594"
        lengthAdjust="spacingAndGlyphs">Math</text>
  <text x="1170" y="255"
        fill="url(#red)"
        font-family="Arial, Helvetica, sans-serif"
        font-size="249"
        font-weight="900"
        letter-spacing="-9"
        textLength="729"
        lengthAdjust="spacingAndGlyphs">Topon</text>

  <!-- Gold bridge and Greek strapline -->
  <path d="M596 334 C900 273 1440 270 1796 326"
        fill="none" stroke="#f4a300" stroke-width="14" stroke-linecap="round"/>
  <text x="612" y="421"
        fill="url(#navy)"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="89"
        font-style="italic"
        font-weight="700"
        textLength="1218"
        lengthAdjust="spacingAndGlyphs">Ο τόπος των Μαθηματικών</text>
</svg>
